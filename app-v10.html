<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فلش‌کارت v11</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f172a;--card:#1e293b;--card2:#273449;--bd:#334155;--text:#e2e8f0;--muted:#94a3b8;--accent:#3b82f6;--green:#4ade80;--yellow:#fbbf24;--red:#f87171}
body.light{--bg:#f1f5f9;--card:#fff;--card2:#f8fafc;--bd:#cbd5e1;--text:#0f172a;--muted:#64748b}
body.dim{--bg:#1a1a2e;--card:#24243e;--card2:#2d2d4a;--bd:#3d3d5c;--text:#d0d0e0;--muted:#8888a0}
body{font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:12px;font-size:15px;line-height:1.6;transition:background .3s,color .3s}
.container{max-width:720px;margin:0 auto}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--card);border-radius:10px;margin-bottom:10px;border:1px solid var(--bd)}
.topbar h1{font-size:16px;font-weight:600}
.topbar .btns{display:flex;gap:6px}
.icon-btn{background:transparent;border:1px solid var(--bd);color:var(--text);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:14px;transition:.2s}
.icon-btn:hover{background:var(--card2);border-color:var(--accent)}
.save-indicator{position:fixed;top:8px;left:8px;background:var(--card);border:1px solid var(--bd);padding:4px 10px;border-radius:20px;font-size:12px;z-index:100;display:none}
.notice{padding:10px 14px;border-radius:10px;margin-bottom:10px;font-size:13px;display:none}
.notice.show{display:block}
.notice.warn{background:rgba(251,191,36,.15);border:1px solid var(--yellow);color:var(--yellow)}
.notice.info{background:rgba(59,130,246,.15);border:1px solid var(--accent);color:var(--accent)}
.search-box{display:flex;gap:6px;margin-bottom:10px}
.search-box input{flex:1;background:var(--card);border:1px solid var(--bd);color:var(--text);border-radius:10px;padding:10px 14px;font-family:inherit;font-size:14px}
.search-box input:focus{outline:none;border-color:var(--accent)}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-bottom:12px}
.menu-btn{background:var(--card);border:1px solid var(--bd);color:var(--text);border-radius:12px;padding:14px 10px;cursor:pointer;font-family:inherit;font-size:13px;text-align:center;transition:.2s;display:flex;flex-direction:column;gap:4px;align-items:center}
.menu-btn:hover{border-color:var(--accent);background:var(--card2);transform:translateY(-2px)}
.menu-btn .emoji{font-size:20px}
.menu-btn .count{font-size:11px;color:var(--muted);background:var(--card2);padding:1px 8px;border-radius:10px}
.welcome{text-align:center;padding:40px 20px;background:var(--card);border-radius:14px;border:1px solid var(--bd);margin-bottom:12px}
.welcome h2{font-size:20px;margin-bottom:8px}
.welcome p{color:var(--muted);font-size:14px}
.card-area{background:var(--card);border-radius:14px;border:1px solid var(--bd);padding:20px;margin-bottom:12px;min-height:200px;position:relative;display:none}
.card-area.show{display:block}
.card-tools{position:absolute;top:10px;left:10px;display:flex;gap:6px}
.card-tools.right{right:10px;left:auto}
.card-tool{background:transparent;border:none;font-size:16px;cursor:pointer;opacity:.5;padding:2px 4px;transition:opacity .2s}
.card-tool:hover,.card-tool.on{opacity:1}
.view-count{position:absolute;bottom:10px;right:14px;font-size:12px;color:var(--muted)}
.card-question{font-size:17px;font-weight:600;padding:20px 40px;text-align:center;min-height:80px;display:flex;align-items:center;justify-content:center;cursor:pointer;line-height:1.7}
.card-answer{font-size:24px;font-weight:700;padding:16px 40px;text-align:center;color:var(--green);display:none;border-top:1px dashed var(--bd);margin-top:10px;line-height:1.7}
.card-answer.show{display:block}
.praise{text-align:center;color:var(--green);font-size:13px;padding:6px;display:none}
.praise.show{display:block}
.days-left{text-align:center;color:var(--muted);font-size:12px;padding:4px;display:none}
.days-left.show{display:block}
.actions{display:none;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.actions.show{display:grid}
.action-btn{padding:14px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--text);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:.2s}
.action-btn:hover{transform:translateY(-2px)}
.action-btn.correct{border-color:var(--green);color:var(--green)}
.action-btn.partial{border-color:var(--yellow);color:var(--yellow)}
.action-btn.wrong{border-color:var(--red);color:var(--red)}
.shortcut-hint{text-align:center;font-size:11px;color:var(--muted);padding:6px}
.nav-row{display:none;gap:8px;margin-bottom:10px}
.nav-row.show{display:flex}
.nav-btn{flex:1;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--text);font-family:inherit;cursor:pointer;font-size:14px}
.nav-btn:hover{border-color:var(--accent)}
.panel{background:var(--card);border-radius:14px;border:1px solid var(--bd);padding:16px;margin-bottom:12px;display:none}
.panel.show{display:block}
.panel h2{font-size:16px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.panel h2 .close{background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:18px}
.topic-item{background:var(--card2);border-radius:10px;padding:12px;margin-bottom:8px;border:1px solid var(--bd)}
.topic-header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.topic-name{font-weight:600;font-size:14px;flex:1}
.topic-actions{display:flex;gap:4px;flex-wrap:wrap}
.mini-btn{background:transparent;border:1px solid var(--bd);color:var(--text);border-radius:6px;padding:3px 8px;cursor:pointer;font-size:12px;font-family:inherit}
.mini-btn:hover{border-color:var(--accent)}
.topic-progress{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin-top:8px}
.topic-progress>div{height:100%;background:var(--accent);transition:width .3s}
.subtopic{padding:8px 10px;margin-top:6px;background:var(--bg);border-radius:8px;display:flex;align-items:center;gap:8px;font-size:13px;flex-wrap:wrap}
.subtopic input[type=checkbox]{accent-color:var(--green)}
.subtopic .sub-name{flex:1}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:none;align-items:center;justify-content:center;padding:16px}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border-radius:14px;padding:20px;max-width:500px;width:100%;max-height:80vh;overflow-y:auto;border:1px solid var(--bd)}
.modal h3{font-size:15px;margin-bottom:12px}
.modal input,.modal textarea,.modal select{width:100%;background:var(--bg);border:1px solid var(--bd);color:var(--text);border-radius:8px;padding:8px 12px;font-family:inherit;font-size:14px;margin-bottom:10px}
.modal textarea{min-height:80px;resize:vertical}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.btn{padding:8px 16px;border-radius:8px;border:1px solid var(--bd);background:var(--card2);color:var(--text);font-family:inherit;cursor:pointer;font-size:13px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.motivation{text-align:center;color:var(--muted);font-size:13px;padding:16px;font-style:italic}
.settings-section{background:var(--card2);border-radius:10px;padding:12px;margin-bottom:10px}
.settings-section h4{font-size:13px;margin-bottom:8px;color:var(--muted);text-transform:uppercase}
.settings-section label{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:13px;gap:8px}
.settings-section input[type=number],.settings-section input[type=text]{width:140px;background:var(--bg);border:1px solid var(--bd);color:var(--text);border-radius:6px;padding:4px 8px;font-family:inherit;text-align:center}
.settings-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.settings-grid .btn{width:100%;text-align:center}
.file-input{display:none}
.empty-msg{text-align:center;color:var(--muted);padding:30px 10px;font-size:14px}
.end-subtopic{display:none;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.chart{display:flex;align-items:flex-end;gap:4px;height:120px;padding:10px;background:var(--bg);border-radius:10px;margin:12px 0;overflow-x:auto}
.chart-bar{flex:1;min-width:24px;background:var(--accent);border-radius:4px 4px 0 0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.chart-bar .bar-val{font-size:10px;color:var(--text);padding-bottom:2px}
.chart-labels{display:flex;gap:4px;padding:0 10px}
.chart-labels>div{flex:1;min-width:24px;font-size:9px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div class="container">

<div class="topbar">
  <h1>📘 فلش‌کارت v11</h1>
  <div class="btns">
    <button class="icon-btn" id="btnTheme" title="تم">🌙</button>
    <button class="icon-btn" id="btnSettings" title="تنظیمات">⚙️</button>
  </div>
</div>

<div class="save-indicator" id="saveInd">✅</div>
<div class="notice warn" id="backupNotice"></div>
<div class="notice info" id="fridayNotice"></div>

<div class="search-box">
  <input type="text" id="searchInput" placeholder="🔍 جستجوی کارت...">
</div>

<div class="menu-grid" id="mainMenu">
  <button class="menu-btn" data-menu="all"><span class="emoji">🗂</span>همه<span class="count" id="cAll">0</span></button>
  <button class="menu-btn" data-menu="due"><span class="emoji">⏰</span>سررسیده<span class="count" id="cDue">0</span></button>
  <button class="menu-btn" data-menu="new"><span class="emoji">🆕</span>جدید<span class="count" id="cNew">0</span></button>
  <button class="menu-btn" data-menu="start"><span class="emoji">🎯</span>استارت<span class="count" id="cStart">0</span></button>
  <button class="menu-btn" data-menu="todayCorrect"><span class="emoji">🟢</span>درست امروز<span class="count" id="cTC">0</span></button>
  <button class="menu-btn" data-menu="todayWrong"><span class="emoji">🔴</span>غلط امروز<span class="count" id="cTW">0</span></button>
  <button class="menu-btn" data-menu="hard"><span class="emoji">🔁</span>سخت‌ها<span class="count" id="cHard">0</span></button>
  <button class="menu-btn" data-menu="starred"><span class="emoji">⭐</span>ستاره‌دار<span class="count" id="cStar">0</span></button>
  <button class="menu-btn" data-menu="suspended"><span class="emoji">⏸</span>معلق<span class="count" id="cSusp">0</span></button>
  <button class="menu-btn" data-menu="deleted"><span class="emoji">🗑</span>حذف‌شده<span class="count" id="cDel">0</span></button>
  <button class="menu-btn" data-menu="topics"><span class="emoji">📚</span>درس‌ها</button>
  <button class="menu-btn" data-menu="subjectSearch"><span class="emoji">🔍</span>جستجوی موضوعی</button>
</div>

<div class="welcome" id="welcome">
  <h2>👋 خوش آمدی</h2>
  <p>یک منو انتخاب کن یا از «درس‌ها» شروع کن</p>
</div>

<div class="card-area" id="cardArea">
  <div class="card-tools">
    <button class="card-tool" id="toolNote" title="یادداشت">📝</button>
    <button class="card-tool" id="toolStar" title="ستاره">⭐</button>
  </div>
  <div class="card-tools right">
    <button class="card-tool" id="toolSusp" title="تعلیق">⏸</button>
    <button class="card-tool" id="toolDel" title="حذف">🗑</button>
  </div>
  <div class="card-question" id="cardQ">—</div>
  <div class="card-answer" id="cardA"></div>
  <div class="praise" id="praise"></div>
  <div class="days-left" id="daysLeft"></div>
  <div class="view-count" id="viewCount">👁 0</div>
</div>

<div class="actions" id="actions">
  <button class="action-btn correct" data-ans="correct">✅ درست</button>
  <button class="action-btn partial" data-ans="partial">🟡 حدودی</button>
  <button class="action-btn wrong" data-ans="wrong">🔴 غلط</button>
</div>

<div class="shortcut-hint" id="shortcutHint" style="display:none">
  5=نمایش پاسخ · 1=درست · 2=حدودی · 3=غلط · 4=رد · ←→=قبلی/بعدی
</div>

<div class="nav-row" id="navRow">
  <button class="nav-btn" id="navPrev">← قبلی</button>
  <button class="nav-btn" id="navSkip">رد (4)</button>
  <button class="nav-btn" id="navNext">بعدی →</button>
</div>

<div class="end-subtopic" id="endSubtopic">
  <button class="btn primary" id="btnEndChart">📊 نمودار</button>
  <button class="btn" id="btnEndBack">🔙 درس‌ها</button>
  <button class="btn" id="btnEndHome">🏠 خانه</button>
</div>

<div class="panel" id="topicsPanel">
  <h2><span>📚 درس‌ها</span><button class="close" id="closeTopics">✕</button></h2>
  <div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap">
    <button class="btn primary" id="btnNewTopic">+ درس جدید</button>
    <label class="btn" for="fileCards">📁 بارگذاری JSON</label>
    <input type="file" class="file-input" id="fileCards" accept=".json" multiple>
  </div>
  <div id="topicsList"></div>
</div>

<div class="panel" id="duePanel">
  <h2><span>⏰ سررسیده‌ها</span><button class="close" id="closeDue">✕</button></h2>
  <div id="dueList"></div>
</div>

<div class="panel" id="subjectSearchPanel">
  <h2><span>🔍 جستجوی موضوعی</span><button class="close" id="closeSubjectSearch">✕</button></h2>
  <input type="text" id="subjectSearchInput" placeholder="نام درس یا مبحث..." style="width:100%;background:var(--bg);border:1px solid var(--bd);color:var(--text);border-radius:8px;padding:10px;font-family:inherit;margin-bottom:10px">
  <div id="subjectSearchResults"></div>
</div>

<div class="panel" id="topicDetailPanel">
  <h2><span id="topicDetailTitle"></span><button class="close" id="closeTopicDetail">✕</button></h2>
  <div id="topicDetailBody"></div>
</div>

<div class="panel" id="subtopicDetailPanel">
  <h2><span id="subtopicDetailTitle"></span><button class="close" id="closeSubtopicDetail">✕</button></h2>
  <div id="subtopicDetailBody"></div>
</div>

<div class="panel" id="settingsPanel">
  <h2><span>⚙️ تنظیمات</span><button class="close" id="closeSettings">✕</button></h2>
  <div class="settings-section">
    <h4>بازه‌های مرور</h4>
    <label>حدودی (روز) <input type="number" id="setPartialDays" min="1"></label>
    <label>زنجیره درست <input type="text" id="setCorrectSteps" placeholder="3,7,14,26,58,125"></label>
    <label>غلط (روز) <input type="number" id="setWrongDays" min="1"></label>
    <label>آستانه سخت‌ها <input type="number" id="setHardThreshold" min="1"></label>
    <button class="btn primary" id="btnSaveSettings" style="margin-top:8px">💾 ذخیره تنظیمات</button>
  </div>
  <div class="settings-section">
    <h4>پشتیبان‌گیری</h4>
    <div class="settings-grid">
      <button class="btn" id="btnExport">📤 خروجی پشتیبان</button>
      <label class="btn" for="fileBackup">📥 وارد کردن پشتیبان</label>
      <input type="file" class="file-input" id="fileBackup" accept=".json">
      <button class="btn" id="btnEmptyJson">📝 ساخت JSON خالی</button>
      <button class="btn" id="btnMergeSimilar">🔗 ادغام مشابه</button>
      <button class="btn" id="btnStorageInfo">ℹ️ وضعیت ذخیره</button>
    </div>
  </div>
  <div class="settings-section">
    <h4>خطر</h4>
    <button class="btn danger" id="btnReset">🗑 ریست کامل</button>
  </div>
</div>

<div class="motivation" id="motivation"></div>
</div>

<div class="modal-overlay" id="modalOverlay"><div class="modal" id="modal"></div></div>

<script>

var DEFAULT_SETTINGS={partialDays:2,correctSteps:[3,7,14,26,58,125],wrongDays:1,hardThreshold:7};
var LS={state:'fc_main_state',settings:'fc_main_settings',topics:'fc_main_topics',theme:'fc_main_theme',backup:'fc_main_backup',friday:'fc_last_friday_v11',mot:'fc_mot_idx_v11'};

/* ===== UTILS ===== */
function $(id){return document.getElementById(id)}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function addDays(s,n){var d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function daysBetween(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000)}
function daysUntil(d){return d?daysBetween(today(),d):null}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function cardKey(q,a){return q+'|||'+a}
function esc(s){if(s==null)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function makeId(){return 'id_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8)}

/* ===== STORAGE ===== */
function saveLS(k,d){try{localStorage.setItem(k,JSON.stringify(d));return true}catch(e){return false}}
function loadLS(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
function saveSS(k,d){try{sessionStorage.setItem(k,JSON.stringify(d))}catch(e){}}
function loadSS(k){try{var v=sessionStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}

function openIDB(){return new Promise(function(res){try{var r=indexedDB.open('fc_main_db',1);r.onupgradeneeded=function(e){var db=e.target.result;if(!db.objectStoreNames.contains('kv'))db.createObjectStore('kv')};r.onsuccess=function(e){idb=e.target.result;res(idb)};r.onerror=function(){res(null)}}catch(e){res(null)}})}
function saveIDB(d){if(!idb)return;try{idb.transaction('kv','readwrite').objectStore('kv').put(d,'state')}catch(e){}}
function loadIDB(){return new Promise(function(res){if(!idb)return res(null);try{var req=idb.transaction('kv','readonly').objectStore('kv').get('state');req.onsuccess=function(){res(req.result)};req.onerror=function(){res(null)}}catch(e){res(null)}})}

function showSaveIndicator(ok){var el=$('saveInd');el.textContent=ok?'✅ ذخیره شد':'❌ خطا';el.style.display='block';setTimeout(function(){el.style.display='none'},1000)}
function saveState(silent){var ok=saveLS(LS.state,STATE);saveCounter++;if(saveCounter%3===0)saveIDB(STATE);saveSS(LS.state,STATE);if(!silent)showSaveIndicator(ok)}
function saveTopics(){saveLS(LS.topics,TOPICS)}
function saveSettings(){saveLS(LS.settings,SETTINGS)}

/* ===== STATE ACCESS ===== */
function getAllCards(){var out=[];TOPICS.forEach(function(t){(t.subtopics||[]).forEach(function(s){(s.cards||[]).forEach(function(c){out.push({topicId:t.id,topicName:t.name,subId:s.id,subName:s.name,q:c.q,a:c.a,key:cardKey(c.q,c.a)})})})});return out}
function findCardByKey(k){var a=getAllCards();for(var i=0;i<a.length;i++)if(a[i].key===k)return a[i];return null}
function getCardState(k){if(!STATE.cards[k]){STATE.cards[k]={seen:false,lastSeen:null,nextDue:null,correctCount:0,partialCount:0,wrongCount:0,totalWrong:0,stepIndex:0,starred:false,suspended:false,deleted:false,viewCount:0,lastWrongDate:null,note:'',todayCorrect:false}}return STATE.cards[k]}
function isActive(k){var s=STATE.cards[k];if(!s)return true;return !s.deleted&&!s.suspended}
function isDeleted(k){var s=STATE.cards[k];return!!(s&&s.deleted)}
function isSuspended(k){var s=STATE.cards[k];return!!(s&&s.suspended)}
function isNew(k){var s=STATE.cards[k];return!s||!s.seen}
function isDue(k){var s=STATE.cards[k];if(!s||s.deleted||s.suspended)return false;if(!s.seen)return false;return!s.nextDue||daysUntil(s.nextDue)<=0}
function isHard(k){var s=STATE.cards[k];if(!s)return false;return(s.totalWrong||0)>=SETTINGS.hardThreshold}
function isStarred(k){var s=STATE.cards[k];return!!(s&&s.starred)}
function isTodayWrong(k){var s=STATE.cards[k];return!!(s&&s.lastWrongDate===today())}
function isStart(k){var s=STATE.cards[k];if(!s||!s.seen)return false;return(s.correctCount+s.partialCount+s.wrongCount)===1}
function isTodayCorrect(k){var s=STATE.cards[k];return!!(s&&s.todayCorrect&&s.lastSeen===today())}
function isSubtopicRead(tid,sid){return!!STATE.readSubtopics[tid+'|'+sid]}
function setSubtopicRead(tid,sid,v){if(v)STATE.readSubtopics[tid+'|'+sid]=true;else delete STATE.readSubtopics[tid+'|'+sid]}

/* ===== COUNTS ===== */
function countBy(fn){return getAllCards().filter(function(c){return fn(c.key)}).length}
function countDueInTopic(tid){var t=TOPICS.find(function(x){return x.id===tid});if(!t)return 0;var n=0;(t.subtopics||[]).forEach(function(s){(s.cards||[]).forEach(function(c){if(isDue(cardKey(c.q,c.a)))n++})});return n}
function countReadInTopic(tid){var t=TOPICS.find(function(x){return x.id===tid});if(!t)return 0;var r=0,tt=0;(t.subtopics||[]).forEach(function(s){tt++;if(isSubtopicRead(tid,s.id))r++});return tt?Math.round(r/tt*100):0}

function updateMenuCounts(){
  $('cAll').textContent=countBy(isActive);
  $('cDue').textContent=countBy(isDue);
  $('cNew').textContent=countBy(function(k){return isActive(k)&&isNew(k)});
  $('cStart').textContent=countBy(isStart);
  $('cTC').textContent=countBy(isTodayCorrect);
  $('cTW').textContent=countBy(isTodayWrong);
  $('cHard').textContent=countBy(isHard);
  $('cStar').textContent=countBy(isStarred);
  $('cSusp').textContent=countBy(isSuspended);
  $('cDel').textContent=countBy(isDeleted);
}

/* ===== SESSION ===== */
function buildQueue(mode,filterKeys){
  var all=getAllCards();
  var keys=filterKeys||all.map(function(c){return c.key});
  var out=[];
  keys.forEach(function(k){
    var c=findCardByKey(k);if(!c)return;
    var s=STATE.cards[k];
    if(mode==='deleted'){if(!isDeleted(k))return}
    else{if(isDeleted(k))return;if(isSuspended(k))return}
    if(mode==='due'&&!isDue(k))return;
    if(mode==='new'&&!isNew(k))return;
    if(mode==='start'&&!isStart(k))return;
    if(mode==='todayCorrect'&&!isTodayCorrect(k))return;
    if(mode==='todayWrong'&&!isTodayWrong(k))return;
    if(mode==='hard'&&!isHard(k))return;
    if(mode==='starred'&&!isStarred(k))return;
    if(mode==='suspended'&&!isSuspended(k))return;
    out.push(c);
  });
  return shuffle(out);
}

function hideAllPanels(){
  ['topicsPanel','duePanel','subjectSearchPanel','topicDetailPanel','subtopicDetailPanel','settingsPanel'].forEach(function(p){$(p).classList.remove('show')});
  $('endSubtopic').style.display='none';
}

function startSession(mode,keys,subInfo){
  SESSION.queue=buildQueue(mode,keys);
  SESSION.idx=0;SESSION.mode=mode;SESSION.answers=[];SESSION.subInfo=subInfo||null;
  if(SESSION.queue.length===0){alert('کارتی برای این بخش نیست');return}
  hideAllPanels();
  $('welcome').style.display='none';
  $('cardArea').classList.add('show');
  $('actions').classList.add('show');
  $('navRow').classList.add('show');
  $('shortcutHint').style.display='block';
  render();
}

function render(){
  var c=SESSION.queue[SESSION.idx];
  if(!c){showSummary();return}
  var s=getCardState(c.key);
  s.viewCount=(s.viewCount||0)+1;
  $('cardQ').textContent=c.q;
  $('cardA').textContent=c.a;
  $('cardA').classList.remove('show');
  $('praise').classList.remove('show');
  $('daysLeft').classList.remove('show');
  $('viewCount').textContent='👁 '+(s.viewCount||0);
  $('toolStar').classList.toggle('on',!!s.starred);
  $('toolSusp').classList.toggle('on',!!s.suspended);
  $('toolDel').classList.toggle('on',!!s.deleted);
  $('toolNote').classList.toggle('on',!!s.note);
  if(s.nextDue){
    var d=daysUntil(s.nextDue);
    $('daysLeft').textContent=d<=0?'📅 سررسیده':('📅 '+d+' روز دیگر');
    $('daysLeft').classList.add('show');
  }
  saveState(true);
}

function showPraise(){
  var p=PRAISES[Math.floor(Math.random()*PRAISES.length)];
  $('praise').textContent=p;
  $('praise').classList.add('show');
}

function updateDailyRecord(){
  var td=today();
  if(!STATE.dailyRecords[td])STATE.dailyRecords[td]={total:0,newCards:0};
  STATE.dailyRecords[td].total++;
}

function answerCard(type){
  var c=SESSION.queue[SESSION.idx];
  if(!c)return;
  var s=getCardState(c.key);
  var wasNew=!s.seen;
  s.seen=true;
  s.lastSeen=today();
  if(type==='correct'){
    s.correctCount++;
    s.todayCorrect=true;
    s.stepIndex=Math.min((s.stepIndex||0)+1,SETTINGS.correctSteps.length-1);
    var days=SETTINGS.correctSteps[s.stepIndex]||SETTINGS.correctSteps[SETTINGS.correctSteps.length-1];
    s.nextDue=addDays(today(),days);
    showPraise();
  }else if(type==='partial'){
    s.partialCount++;
    s.todayCorrect=false;
    s.nextDue=addDays(today(),SETTINGS.partialDays);
  }else{
    s.wrongCount++;s.totalWrong++;
    s.todayCorrect=false;
    s.lastWrongDate=today();
    s.stepIndex=0;
    s.nextDue=addDays(today(),SETTINGS.wrongDays);
  }
  if(wasNew&&STATE.dailyRecords[today()])STATE.dailyRecords[today()].newCards++;
  updateDailyRecord();
  SESSION.answers.push({key:c.key,type:type});
  saveState();
  setTimeout(function(){nextCard()},type==='correct'?700:250);
}

function nextCard(){
  SESSION.idx++;
  if(SESSION.idx>=SESSION.queue.length){showSummary();return}
  render();
}
function prevCard(){if(SESSION.idx>0){SESSION.idx--;render()}}
function skipCard(){nextCard()}

function showSummary(){
  $('cardArea').classList.remove('show');
  $('actions').classList.remove('show');
  $('navRow').classList.remove('show');
  $('shortcutHint').style.display='none';
  if(SESSION.subInfo){
    $('endSubtopic').style.display='grid';
  }else{
    $('welcome').style.display='block';
    $('welcome').innerHTML='<h2>🎉 تمام شد!</h2><p>'+SESSION.answers.length+' کارت مرور شد.</p>';
  }
  updateMenuCounts();
  saveTopics();
}

/* ===== KEYBOARD ===== */
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(!$('cardArea').classList.contains('show'))return;
  if(e.key==='5'){$('cardA').classList.add('show')}
  else if(e.key==='1'){if($('cardA').classList.contains('show'))answerCard('correct')}
  else if(e.key==='2'){if($('cardA').classList.contains('show'))answerCard('partial')}
  else if(e.key==='3'){if($('cardA').classList.contains('show'))answerCard('wrong')}
  else if(e.key==='4'){skipCard()}
  else if(e.key==='ArrowLeft'){prevCard()}
  else if(e.key==='ArrowRight'){nextCard()}
});

  if(TOPICS.length===0){el.innerHTML='<div class="empty-msg">هنوز درسی نداری. یه درس جدید بساز یا JSON بارگذاری کن.</div>';return}

    html+='</div></div>';
    html+='<div class="topic-progress"><div style="width:'+pct+'%"></div></div>';
    html+='<div style="font-size:11px;color:var(--muted);margin-top:4px">'+pct+'% خوانده'+(due?' · '+due+' سررسیده':'')+'</div>';
    (t.subtopics||[]).forEach(function(s){

      html+='<input type="checkbox" data-act="readSub" data-tid="'+t.id+'" data-sid="'+s.id+'" '+(read?'checked':'')+'>';
      html+='<span class="sub-name">'+esc(s.name)+'</span>';
      html+='<button class="mini-btn" data-act="reviewSub" data-tid="'+t.id+'" data-sid="'+s.id+'">▶</button>';
      html+='<button class="mini-btn" data-act="randomSub" data-tid="'+t.id+'" data-sid="'+s.id+'">🎲</button>';
      html+='<button class="mini-btn" data-act="subDetail" data-tid="'+t.id+'" data-sid="'+s.id+'">📋</button>';
      html+='<button class="mini-btn" data-act="renameSub" data-tid="'+t.id+'" data-sid="'+s.id+'">✏</button>';
      html+='<button class="mini-btn" data-act="delSub" data-tid="'+t.id+'" data-sid="'+s.id+'">🗑</button>';
      html+='</div>';
    });
    html+='<button class="mini-btn" data-act="addSub" data-tid="'+t.id+'" style="margin-top:8px">+ مبحث جدید</button>';
    html+='</div>';
  });
  el.innerHTML=html;
  bindTopicsEvents();
}

function bindTopicsEvents(){
  document.querySelectorAll('#topicsList [data-act]').forEach(function(el){
    var a=el.dataset.act;
    if(a==='readSub'){el.addEventListener('change',function(){setSubtopicRead(el.dataset.tid,el.dataset.sid,el.checked);saveState();renderTopicsList()})}
    else{el.addEventListener('click',function(){handleTopicAction(a,el.dataset.tid,el.dataset.sid)})}
  });
}

function handleTopicAction(a,tid,sid){
  var ti=TOPICS.findIndex(function(x){return x.id===tid});
  var t=TOPICS[ti];
  if(a==='reviewTopic'){
    var keys=[];(t.subtopics||[]).forEach(function(s){(s.cards||[]).forEach(function(c){keys.push(cardKey(c.q,c.a))})});
    startSession('all',keys);
  }
  else if(a==='renameTopic'){var n=prompt('نام جدید:',t.name);if(n){t.name=n;saveTopics();renderTopicsList()}}
  else if(a==='upTopic'&&ti>0){var tmp=TOPICS[ti-1];TOPICS[ti-1]=TOPICS[ti];TOPICS[ti]=tmp;saveTopics();renderTopicsList()}
  else if(a==='downTopic'&&ti<TOPICS.length-1){var tmp2=TOPICS[ti+1];TOPICS[ti+1]=TOPICS[ti];TOPICS[ti]=tmp2;saveTopics();renderTopicsList()}
  else if(a==='delTopic'){if(confirm('حذف درس «'+t.name+'»؟')){TOPICS.splice(ti,1);saveTopics();renderTopicsList()}}
  else if(a==='addSub'){var sn=prompt('نام مبحث جدید:');if(sn){t.subtopics.push({id:makeId(),name:sn,cards:[]});saveTopics();renderTopicsList()}}
  else if(a==='reviewSub'){
    var s=t.subtopics.find(function(x){return x.id===sid});
    var ks=(s.cards||[]).map(function(c){return cardKey(c.q,c.a)});
    startSession('all',ks,{tid:tid,sid:sid});
  }
  else if(a==='randomSub'){
    var s2=t.subtopics.find(function(x){return x.id===sid});
    var ks2=(s2.cards||[]).map(function(c){return cardKey(c.q,c.a)});
    startSession('all',shuffle(ks2).slice(0,10),{tid:tid,sid:sid});
  }
  else if(a==='subDetail'){openSubtopicDetail(tid,sid)}
  else if(a==='renameSub'){var s3=t.subtopics.find(function(x){return x.id===sid});var nn=prompt('نام جدید:',s3.name);if(nn){s3.name=nn;saveTopics();renderTopicsList()}}
  else if(a==='delSub'){if(confirm('حذف این مبحث؟')){t.subtopics=t.subtopics.filter(function(x){return x.id!==sid});saveTopics();renderTopicsList()}}
}

$('btnNewTopic').onclick=function(){
  var n=prompt('نام درس جدید:');
  if(n){TOPICS.push({id:makeId(),name:n,subtopics:[]});saveTopics();renderTopicsList()}
};

/* ===== SUBTOPIC DETAIL ===== */
function openSubtopicDetail(tid,sid){
  var t=TOPICS.find(function(x){return x.id===tid});

  $('subtopicDetailTitle').textContent='📋 '+t.name+' / '+s.name;
  var html='<div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap"><button class="btn primary" id="btnAddCard">+ کارت جدید</button><button class="btn" id="btnMarkAllRead">📌 همه خوانده</button><button class="btn" id="btnDelSelected">🗑 حذف گروهی</button></div>';
  html+='<div id="subCards">';
  (s.cards||[]).forEach(function(c,i){
    var st=STATE.cards[cardKey(c.q,c.a)]||{};
    html+='<div class="subtopic"><input type="checkbox" class="subCardChk" data-idx="'+i+'"><span class="sub-name">'+esc(c.q)+'</span><button class="mini-btn" data-idx="'+i+'" data-act="editCard">✏</button><button class="mini-btn" data-idx="'+i+'" data-act="delCard">🗑</button></div>';
  });
  html+='</div>';
  $('subtopicDetailBody').innerHTML=html;
  hideAllPanels();$('subtopicDetailPanel').classList.add('show');
  $('btnAddCard').onclick=function(){var q=prompt('سؤال:');if(!q)return;var a=prompt('پاسخ:');if(!a)return;s.cards.push({q:q,a:a});saveTopics();openSubtopicDetail(tid,sid)};
  $('btnMarkAllRead').onclick=function(){setSubtopicRead(tid,sid,true);saveState();alert('انجام شد')};
  $('btnDelSelected').onclick=function(){var del=[];document.querySelectorAll('.subCardChk:checked').forEach(function(ch){del.push(parseInt(ch.dataset.idx))});if(!del.length)return;if(!confirm('حذف '+del.length+' کارت؟'))return;del.sort(function(a,b){return b-a}).forEach(function(i){s.cards.splice(i,1)});saveTopics();openSubtopicDetail(tid,sid)};
  document.querySelectorAll('#subtopicDetailBody [data-act]').forEach(function(b){
    b.onclick=function(){
      var i=parseInt(b.dataset.idx);
      if(b.dataset.act==='editCard'){var q=prompt('سؤال:',s.cards[i].q);if(q===null)return;var a=prompt('پاسخ:',s.cards[i].a);if(a===null)return;s.cards[i]={q:q,a:a};saveTopics();openSubtopicDetail(tid,sid)}
      else if(b.dataset.act==='delCard'){if(confirm('حذف؟')){s.cards.splice(i,1);saveTopics();openSubtopicDetail(tid,sid)}}
    }
  });
}
$('closeSubtopicDetail').onclick=function(){$('subtopicDetailPanel').classList.remove('show');showTopicsPanel()};

/* ===== DUE PANEL ===== */
function showDuePanel(){
  hideAllPanels();$('duePanel').classList.add('show');
  var due=getAllCards().filter(function(c){return isDue(c.key)});

  if(!due.length){el.innerHTML='<div class="empty-msg">چیزی سررسیده نیست ✅</div>';return}

    html+='<div class="due-group"><h4>'+esc(tn)+' ('+groups[tn].length+')</h4>';

  });

  $('btnReviewAllDue').onclick=function(){startSession('due')};

$('closeDue').onclick=function(){$('duePanel').classList.remove('show')};

/* ===== SUBJECT SEARCH ===== */
function showSubjectSearch(){hideAllPanels();$('subjectSearchPanel').classList.add('show');$('subjectSearchInput').focus();renderSubjectSearch('')}
$('closeSubjectSearch').onclick=function(){$('subjectSearchPanel').classList.remove('show')};
$('subjectSearchInput').addEventListener('input',function(){renderSubjectSearch(this.value)});
function renderSubjectSearch(q){
  q=(q||'').trim().toLowerCase();
  var html='';
  TOPICS.forEach(function(t){
    var tMatch=t.name.toLowerCase().indexOf(q)>=0;
    (t.subtopics||[]).forEach(function(s){
      var sMatch=s.name.toLowerCase().indexOf(q)>=0;
      if(tMatch||sMatch||!q){
        html+='<div class="subtopic"><span class="sub-name">📚 '+esc(t.name)+' / '+esc(s.name)+' ('+(s.cards||[]).length+' کارت)</span><button class="mini-btn" data-tid="'+t.id+'" data-sid="'+s.id+'">▶</button></div>';
      }
    });
  });
  if(!html)html='<div class="empty-msg">چیزی پیدا نشد</div>';
  $('subjectSearchResults').innerHTML=html;
  document.querySelectorAll('#subjectSearchResults [data-tid]').forEach(function(b){
    b.onclick=function(){
      var t=TOPICS.find(function(x){return x.id===b.dataset.tid});
      var s=t.subtopics.find(function(x){return x.id===b.dataset.sid});
      startSession('all',(s.cards||[]).map(function(c){return cardKey(c.q,c.a)}),{tid:t.id,sid:s.id});
    }
  });
}

/* ===== SEARCH BOX ===== */
$('searchInput').addEventListener('input',function(){
  var q=this.value.trim().toLowerCase();
  if(!q)return;

});

$('btnSettings').onclick=function(){hideAllPanels();$('settingsPanel').classList.add('show');fillSettings()};
$('closeSettings').onclick=function(){$('settingsPanel').classList.remove('show')};
function fillSettings(){$('setPartialDays').value=SETTINGS.partialDays;$('setCorrectSteps').value=SETTINGS.correctSteps.join(',');$('setWrongDays').value=SETTINGS.wrongDays;$('setHardThreshold').value=SETTINGS.hardThreshold}
$('btnSaveSettings').onclick=function(){
  SETTINGS.partialDays=parseInt($('setPartialDays').value)||2;

/* ===== EXPORT / IMPORT ===== */
function downloadJSON(data,name){var b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click()}
$('btnExport').onclick=function(){
  var data={version:11,exportedAt:new Date().toISOString(),settings:SETTINGS,state:STATE,topics:TOPICS};
  downloadJSON(data,'flashcard-backup-'+today()+'.json');
  saveLS(LS.backup,today());updateBackupNotice();
};
$('fileBackup').addEventListener('change',function(e){
  var f=e.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){try{var d=JSON.parse(r.result);if(!confirm('جایگزین کردن کامل؟'))return;if(d.settings)SETTINGS=d.settings;if(d.state)STATE=d.state;if(d.topics)TOPICS=d.topics;saveSettings();saveState();saveTopics();alert('وارد شد ✅');location.reload()}catch(err){alert('فایل خرابه')}};
  r.readAsText(f);
});
$('btnEmptyJson').onclick=function(){
  downloadJSON({topic:'نام درس',subtopics:[{name:'نام مبحث',cards:[{q:'سؤال نمونه؟',a:'پاسخ نمونه'}]}]},'empty-template.json');
};
$('fileCards').addEventListener('change',function(e){
  var files=Array.from(e.target.files);
  files.forEach(function(f){
    var r=new FileReader();
    r.onload=function(){try{handleJSONUpload(r.result)}catch(err){console.warn(err)}};
    r.readAsText(f);
  });
});
function handleJSONUpload(text){
  var data=JSON.parse(text);
  var added=0,skipped=0;
  var existing=new Set(getAllCards().map(function(c){return c.key}));
  function addCard(topicName,subName,q,a){
    var t=TOPICS.find(function(x){return x.name===topicName});
    if(!t){t={id:makeId(),name:topicName,subtopics:[]};TOPICS.push(t)}
    var s=t.subtopics.find(function(x){return x.name===subName});
    if(!s){s={id:makeId(),name:subName,cards:[]};t.subtopics.push(s)}
    var k=cardKey(q,a);
    if(existing.has(k)){skipped++;return}
    s.cards.push({q:q,a:a});existing.add(k);added++;
  }
  if(Array.isArray(data)){data.forEach(function(c){addCard('عمومی','عمومی',c.q,c.a)})}
  else if(data.topics){data.topics.forEach(function(t){(t.subtopics||[]).forEach(function(s){(s.cards||[]).forEach(function(c){addCard(t.name,s.name,c.q,c.a)})})})}
  else if(data.topic){
    if(data.subtopics){data.subtopics.forEach(function(s){(s.cards||[]).forEach(function(c){addCard(data.topic,s.name,c.q,c.a)})})}
    else if(data.cards){data.cards.forEach(function(c){addCard(data.topic,'عمومی',c.q,c.a)})}
  }
  saveTopics();updateMenuCounts();
  alert('اضافه: '+added+' | رد: '+skipped);
  if($('topicsPanel').classList.contains('show'))renderTopicsList();
}

/* ===== MERGE SIMILAR ===== */
$('btnMergeSimilar').onclick=function(){
  var groups={};
  getAllCards().forEach(function(c){var q=c.q.trim();if(!groups[q])groups[q]=[];groups[q].push(c)});
  var count=0;
  Object.keys(groups).forEach(function(q){
    if(groups[q].length<2)return;
    var answers=[...new Set(groups[q].map(function(c){return c.a}))];
    if(answers.length<2)return;
    if(!confirm('ادغام '+groups[q].length+' کارت با سؤال:\n'+q.slice(0,60)+'\n؟'))return;
    var merged=answers.join(' • ');
    var first=groups[q][0];
    var t=TOPICS.find(function(x){return x.id===first.topicId});
    var s=t.subtopics.find(function(x){return x.id===first.subId});
    s.cards=s.cards.filter(function(c){return c.q.trim()!==q});
    s.cards.push({q:q,a:merged});
    STATE.cards[cardKey(q,merged)]={seen:false,lastSeen:null,nextDue:null,correctCount:0,partialCount:0,wrongCount:0,totalWrong:0,stepIndex:0,starred:false,suspended:false,deleted:false,viewCount:0,lastWrongDate:null,note:'',todayCorrect:false};
    count++;
  });
  saveTopics();saveState();alert(count+' گروه ادغام شد');
};

$('btnStorageInfo').onclick=function(){

/* ===== RESET ===== */
$('btnReset').onclick=function(){

  if(!confirm('واقعاً مطمئنی؟'))return;
  if(!confirm('آخرین هشدار! پاک کنم؟'))return;
  localStorage.clear();sessionStorage.clear();

  location.reload();
};

/* ===== END SUBTOPIC ===== */
$('btnEndBack').onclick=function(){$('endSubtopic').style.display='none';SESSION.subInfo=null;showTopicsPanel()};
$('btnEndHome').onclick=function(){$('endSubtopic').style.display='none';SESSION.subInfo=null;$('welcome').style.display='block';$('welcome').innerHTML='<h2>👋 خوش آمدی</h2><p>یک منو انتخاب کن</p>'};
$('btnEndChart').onclick=function(){
  var td=today();
  var days=[];
  for(var i=6;i>=0;i--)days.push(addDays(td,-i));
  var vals=days.map(function(d){return(STATE.dailyRecords[d]&&STATE.dailyRecords[d].total)||0});
  var max=Math.max.apply(null,vals)||1;
  var html='<h3>📊 ۷ روز اخیر</h3><div class="chart">';
  vals.forEach(function(v){html+='<div class="chart-bar" style="height:'+(v/max*100)+'%"><span class="bar-val">'+v+'</span></div>'});
  html+='</div><div class="chart-labels">';
  days.forEach(function(d){html+='<div>'+d.slice(5)+'</div>'});
  html+='</div>';
  openModal(html+'<div class="modal-actions"><button class="btn primary" onclick="closeModal()">بستن</button></div>');
};

/* ===== MODAL ===== */
function openModal(html){$('modal').innerHTML=html;$('modalOverlay').classList.add('show')}
function closeModal(){$('modalOverlay').classList.remove('show')}
$('modalOverlay').onclick=function(e){if(e.target===this)closeModal()};

/* ===== THEME ===== */
function applyTheme(t){
  document.body.classList.remove('light','dim');
  if(t==='light')document.body.classList.add('light');
  else if(t==='dim')document.body.classList.add('dim');
  $('btnTheme').textContent=t==='light'?'☀️':t==='dim'?'🌆':'🌙';
  saveLS(LS.theme,t);
}
$('btnTheme').onclick=function(){
  var cur=loadLS(LS.theme)||'dark';
  var next=cur==='dark'?'light':cur==='light'?'dim':'dark';
  applyTheme(next);
};

/* ===== FRIDAY & BACKUP ===== */
function checkFriday(){
  var d=new Date();
  if(d.getDay()===5){
    var last=loadLS(LS.friday);
    if(last!==today()){
      $('fridayNotice').textContent='🕌 جمعه است! وقت پشتیبان‌گیری 📤';
      $('fridayNotice').classList.add('show');
      saveLS(LS.friday,today());
    }
  }
}
function updateBackupNotice(){
  var last=loadLS(LS.backup);
  if(!last){
    $('backupNotice').textContent='⚠️ هیچ‌وقت پشتیبان نگرفتی!';
    $('backupNotice').classList.add('show');
    return;
  }
  var d=daysBetween(last,today());
  if(d>=3){
    $('backupNotice').textContent='⚠️ ' + d + ' روز از آخرین پشتیبان گذشته';
    $('backupNotice').classList.add('show');
  }else{$('backupNotice').classList.remove('show')}
}

/* ===== MOTIVATION ===== */
function pickMotivation(){
  var i=loadLS(LS.mot)||0;
  i=(i+1)%MOTIVATIONS.length;
  saveLS(LS.mot,i);
  $('motivation').textContent='💡 '+MOTIVATIONS[i];
}

/* ===== INIT ===== */
async function init(){
  await openIDB();
  var s=loadLS(LS.state);
  if(!s){var idbs=await loadIDB();if(idbs)s=idbs}
  STATE=s||{cards:{},history:{},readSubtopics:{},dailyRecords:{},lastModified:0,masteredCount:0,totalCards:0};
  STATE.cards=STATE.cards||{};STATE.history=STATE.history||{};STATE.readSubtopics=STATE.readSubtopics||{};STATE.dailyRecords=STATE.dailyRecords||{};
  TOPICS=loadLS(LS.topics)||[];
  var st=loadLS(LS.settings);if(st)SETTINGS=Object.assign({},DEFAULT_SETTINGS,st);
  applyTheme(loadLS(LS.theme)||'dark');
  checkFriday();updateBackupNotice();pickMotivation();
  updateMenuCounts();
  setInterval(pickMotivation,60000);
}

document.addEventListener('visibilitychange',function(){if(document.hidden)saveState(true)});
window.addEventListener('beforeunload',function(){saveState(true)});

init();
