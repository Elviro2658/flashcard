<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فلش‌کارت آناتومی</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f172a;--card:#1e293b;--bd:#334155;--tx:#e2e8f0;--mt:#94a3b8;--ac:#3b82f6;--ok:#4ade80;--pt:#fbbf24;--wr:#f87171;--an:#fcd34d}
body.light{--bg:#f1f5f9;--card:#fff;--bd:#cbd5e1;--tx:#0f172a;--mt:#64748b;--an:#b45309}
body{font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px}
.topbar{width:100%;max-width:900px;display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.topbar h1{font-size:.82rem;color:var(--mt)}
.topbar .clock{font-size:.7rem;color:var(--mt)}
.topbar .btns{display:flex;gap:4px;flex-wrap:wrap}
.topbar button{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:5px 8px;font-family:inherit;font-size:.7rem;cursor:pointer}
.topbar button:hover{background:var(--bd)}
.topbar button.save-flash{background:#16a34a;color:#fff;border-color:#16a34a}
.topbar button.upload-btn{background:#7c3aed;color:#fff;border-color:#7c3aed}
.save-indicator{width:100%;max-width:900px;text-align:center;font-size:.68rem;color:var(--mt);margin-bottom:6px;min-height:14px}
.save-indicator.ok{color:#4ade80}.save-indicator.warn{color:#fbbf24}.save-indicator.err{color:#f87171}
.menu{width:100%;max-width:900px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.menu h2{font-size:.85rem;margin-bottom:8px;color:var(--mt)}
.menu .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px}
.menu button{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:9px;padding:9px 6px;font-family:inherit;font-size:.75rem;cursor:pointer;transition:transform .1s,background .15s}
.menu button:hover{background:var(--bd);transform:translateY(-1px)}
.menu button small{display:block;color:var(--mt);font-size:.6rem;margin-top:2px}
.welcome{width:100%;max-width:900px;background:var(--card);border:1px solid var(--bd);border-radius:11px;padding:9px 12px;margin-bottom:8px;font-size:.8rem;text-align:center}
.welcome b{color:var(--ac)}
.welcome.empty{color:var(--mt);font-style:italic}
.stats-bar{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;width:100%;max-width:900px;margin-bottom:6px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:9px;padding:5px 10px;text-align:center;min-width:65px;flex:1}
.stat .num{font-size:1.05rem;font-weight:700}
.stat .lbl{font-size:.6rem;color:var(--mt)}
.stat.c .num{color:var(--ok)}.stat.p .num{color:var(--pt)}.stat.w .num{color:var(--wr)}
.stat.pr .num{color:var(--ac)}.stat.rm .num{color:#fbbf24}
.progress-track{width:100%;max-width:900px;height:7px;background:var(--card);border-radius:99px;overflow:hidden;margin-bottom:10px;border:1px solid var(--bd)}
.progress-fill{height:100%;width:0%;background:linear-gradient(90deg,#3b82f6,#8b5cf6);transition:width .3s}
.card{background:var(--card);border-radius:16px;padding:28px 20px 56px;min-height:300px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.2);cursor:pointer;position:relative;border:1px solid var(--bd);width:100%;max-width:900px;transition:transform .15s;user-select:none}
.card:active{transform:scale(.99)}
.card.revealed{cursor:default}
.card .meta{position:absolute;top:8px;right:12px;left:12px;display:flex;justify-content:space-between;font-size:.65rem;color:var(--mt)}
.card .star{position:absolute;top:6px;left:12px;font-size:1.3rem;cursor:pointer;opacity:.5;transition:opacity .15s,transform .1s;z-index:2}
.card .star:hover{opacity:1;transform:scale(1.15)}
.card .star.on{opacity:1;color:#fbbf24}
.card .tools{position:absolute;bottom:8px;left:10px;display:flex;gap:5px;z-index:2}
.card .tools button{background:var(--bg);color:var(--mt);border:1px solid var(--bd);border-radius:7px;padding:4px 9px;font-family:inherit;font-size:.68rem;cursor:pointer}
.card .tools button:hover{background:var(--bd);color:var(--tx)}
.card .viewcount{position:absolute;bottom:12px;right:12px;font-size:.65rem;color:var(--mt);opacity:.7}
.card .question{font-size:1.12rem;line-height:1.9;font-weight:600;padding:0 8px;margin-bottom:6px}
.card .hint{margin-top:24px;font-size:.75rem;color:var(--mt);border-top:1px dashed var(--bd);padding-top:12px;width:100%}
.card .answer{margin-top:8px;padding-top:6px;width:100%;font-size:1.5rem;line-height:2.1;color:var(--an);display:none;font-weight:600}
.card.revealed .answer{display:block}
.card.revealed .hint{display:none}
.answer-label{display:inline-block;font-size:.72rem;color:var(--mt);background:var(--bg);padding:2px 10px;border-radius:99px;margin-bottom:6px;font-weight:400}
.actions{display:flex;gap:6px;margin-top:12px;width:100%;max-width:900px;opacity:0;pointer-events:none;transition:opacity .2s}
.actions.show{opacity:1;pointer-events:auto}
.actions button{flex:1;padding:12px 5px;border:none;border-radius:11px;font-size:.88rem;font-weight:700;cursor:pointer;font-family:inherit}
.actions button:active{transform:scale(.97)}
.btn-correct{background:#16a34a;color:#fff}
.btn-partial{background:#d97706;color:#fff}
.btn-wrong{background:#dc2626;color:#fff}
.btn-skip{background:#475569;color:#fff;flex:0 0 auto;padding:12px 12px;font-size:.75rem}
.nav-row{display:flex;gap:6px;margin-top:10px;width:100%;max-width:900px;justify-content:center;flex-wrap:wrap}
.nav-row button{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px 12px;font-family:inherit;font-size:.75rem;cursor:pointer}
.nav-row button:hover{background:var(--bd)}
.nav-row button:disabled{opacity:.35;cursor:not-allowed}
.summary{display:none;width:100%;max-width:900px;background:var(--card);border-radius:14px;padding:20px;text-align:center;border:1px solid var(--bd)}
.summary.show{display:block}
.summary h2{margin-bottom:10px;font-size:1rem}
.summary .big{font-size:2rem;font-weight:800;margin:5px 0;color:var(--ok)}
.summary .row{display:flex;justify-content:center;gap:16px;margin:12px 0;flex-wrap:wrap}
.summary .row .num{font-size:1.3rem;font-weight:700}
.summary .row .lbl{font-size:.7rem;color:var(--mt)}
.summary button{margin-top:12px;padding:10px 22px;border:none;border-radius:9px;background:var(--ac);color:#fff;font-family:inherit;font-size:.85rem;font-weight:700;cursor:pointer}
.search-box{width:100%;max-width:900px;margin-bottom:8px;display:none}
.search-box.show{display:block}
.search-box input{width:100%;padding:9px 12px;border-radius:9px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-family:inherit;font-size:.85rem}
.search-results{max-height:220px;overflow-y:auto;margin-top:5px;border-radius:9px;border:1px solid var(--bd);background:var(--card)}
.search-results div{padding:8px 10px;border-bottom:1px solid var(--bd);font-size:.78rem;cursor:pointer}
.search-results div:hover{background:var(--bg)}
.settings{display:none;width:100%;max-width:900px;background:var(--card);border-radius:12px;padding:16px;border:1px solid var(--bd);margin-bottom:10px}
.settings.show{display:block}
.settings h3{font-size:.88rem;margin-bottom:8px}
.settings label{display:block;font-size:.72rem;color:var(--mt);margin:6px 0 3px}
.settings input{width:100%;padding:7px 10px;border-radius:7px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-family:inherit;font-size:.82rem}
.settings .row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.settings .row button{flex:1;padding:8px;border:none;border-radius:7px;background:var(--ac);color:#fff;font-family:inherit;font-size:.75rem;cursor:pointer}
.settings .row button.danger{background:#dc2626}
.settings .row button.neutral{background:#475569}
.settings .row button.green{background:#16a34a}
.settings .row button.purple{background:#7c3aed}
.weekly-chart{display:flex;gap:3px;align-items:flex-end;height:45px;margin-top:6px}
.weekly-chart .bar{flex:1;background:var(--ac);border-radius:3px 3px 0 0;min-height:3px}
.weekly-chart .bar-lbl{font-size:.58rem;color:var(--mt);text-align:center;margin-top:3px}
.backup-notice{display:none;width:100%;max-width:900px;padding:9px 12px;background:#78350f;color:#fde68a;border-radius:9px;font-size:.75rem;margin-bottom:8px;text-align:center}
.backup-notice.show{display:block}
.backup-notice button{background:#fbbf24;color:#000;border:none;border-radius:5px;padding:3px 9px;margin-right:6px;font-family:inherit;font-size:.72rem;cursor:pointer;font-weight:700}
.panel{width:100%;max-width:900px;background:var(--card);border-radius:14px;padding:16px;border:1px solid var(--bd);margin-bottom:10px;display:none}
.panel.show{display:block}
.panel h2{font-size:.95rem;margin-bottom:12px}
.panel .close-btn{float:left;background:transparent;border:1px solid var(--bd);color:var(--mt);border-radius:6px;padding:3px 9px;cursor:pointer;font-family:inherit;font-size:.72rem}
.topic-item{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:6px}
.topic-item .head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.topic-item .name{font-weight:600;font-size:.88rem;display:flex;align-items:center;gap:6px;flex:1;cursor:pointer}
.topic-item .name .arrow{color:var(--mt);font-size:.7rem;transition:transform .2s}
.topic-item.open .name .arrow{transform:rotate(90deg)}
.topic-item .actions{display:flex;gap:4px;flex-wrap:wrap}
.topic-item .actions button{background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:6px;padding:4px 8px;font-family:inherit;font-size:.7rem;cursor:pointer}
.topic-item .actions button:hover{background:var(--bd)}
.topic-item .actions button.primary{background:var(--ac);color:#fff;border-color:var(--ac)}
.topic-item .actions button.danger{background:#dc2626;color:#fff;border-color:#dc2626}
.topic-item .subtopics{margin-top:8px;padding-top:8px;border-top:1px solid var(--bd);display:none}
.topic-item.open .subtopics{display:block}
.subtopic-item{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;margin-bottom:5px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.subtopic-item .sub-name{font-size:.82rem;flex:1;display:flex;align-items:center;gap:6px}
.subtopic-item .sub-actions{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.subtopic-item .sub-actions button{background:var(--bg);border:1px solid var(--bd);color:var(--tx);border-radius:5px;padding:3px 8px;font-family:inherit;font-size:.68rem;cursor:pointer}
.subtopic-item .sub-actions button:hover{background:var(--bd)}
.subtopic-item .sub-actions button.primary{background:var(--ac);color:#fff;border-color:var(--ac)}
.subtopic-item .sub-actions button.danger{background:#dc2626;color:#fff;border-color:#dc2626}
.subtopic-item input[type="checkbox"]{width:16px;height:16px;cursor:pointer}
.subtopic-item .card-count{font-size:.68rem;color:var(--mt);background:var(--bg);padding:2px 7px;border-radius:99px}
.panel .top-actions{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.panel .top-actions button{background:var(--ac);color:#fff;border:none;border-radius:7px;padding:7px 12px;font-family:inherit;font-size:.78rem;cursor:pointer;font-weight:600}
.panel .top-actions button.green{background:#16a34a}
.panel .top-actions button.purple{background:#7c3aed}
.panel .top-actions button.neutral{background:#475569}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;justify-content:center;align-items:center;padding:16px}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border-radius:14px;padding:20px;max-width:520px;width:100%;border:1px solid var(--bd);max-height:90vh;overflow-y:auto}
.modal h3{margin-bottom:12px;font-size:1rem}
.modal label{display:block;font-size:.72rem;color:var(--mt);margin:8px 0 3px}
.modal input,.modal textarea{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-family:inherit;font-size:.85rem;resize:vertical}
.modal .row{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
.modal .row button{flex:1;padding:9px;border:none;border-radius:8px;font-family:inherit;font-size:.82rem;cursor:pointer;font-weight:600}
.modal .row button.primary{background:var(--ac);color:#fff}
.modal .row button.danger{background:#dc2626;color:#fff}
.modal .row button.neutral{background:#475569;color:#fff}
.alert-bar{background:#1e40af;color:#dbeafe;padding:10px 12px;border-radius:9px;font-size:.8rem;margin-bottom:10px;text-align:center;display:none}
.alert-bar.show{display:block}
.alert-bar.ok{background:#166534;color:#dcfce7}
.alert-bar.warn{background:#78350f;color:#fef3c7}
.alert-bar.err{background:#7f1d1d;color:#fee2e2}
</style>
</head>
<body>

<div class="topbar">
  <h1>📚 فلش‌کارت آناتومی</h1>
  <div class="btns">
    <span class="clock" id="clock"></span>
    <button class="save-flash" id="btnSaveNow" title="ذخیره فوری">💾</button>
    <button class="upload-btn" id="btnUploadTop" title="بارگذاری JSON">📁</button>
    <button id="btnSearch" title="جستجو">🔍</button>
    <button id="btnTheme" title="حالت شب/روز">🌗</button>
    <button id="btnSettings" title="تنظیمات">⚙</button>
    <button id="btnBackMenu" title="منوی اصلی">🏠</button>
  </div>
</div>

<div class="save-indicator" id="saveIndicator">آماده</div>

<div class="backup-notice" id="backupNotice">
  ⚠️ مدت زیادی از آخرین پشتیبان‌گیری گذشته.
  <button id="btnQuickExport">📤 همین حالا خروجی بگیر</button>
</div>

<div class="alert-bar" id="alertBar"></div>

<div class="search-box" id="searchBox">
  <input type="text" id="searchInput" placeholder="جستجو در سؤال و پاسخ...">
  <div class="search-results" id="searchResults"></div>
</div>

<div class="settings" id="settings">
  <h3>⚙ تنظیمات</h3>
  <label>بازه «حدودی» (روز)</label>
  <input type="number" id="setPartial" value="2" min="1">
  <label>زنجیره «درست» (با کاما)</label>
  <input type="text" id="setCorrect" value="3,7,14,26,58,125">
  <label>بازه «غلط» (روز)</label>
  <input type="number" id="setWrong" value="1" min="1">
  <label>آستانه «سخت‌ها» (تعداد غلط)</label>
  <input type="number" id="setHardThreshold" value="3" min="1">
  <div class="row">
    <button class="green" id="btnSaveSettings">💾 ذخیره تنظیمات</button>
    <button class="purple" id="btnUploadSettings">📁 بارگذاری JSON</button>
  </div>
  <div class="row">
    <button class="neutral" id="btnExport">📤 خروجی پشتیبان</button>
    <button class="neutral" id="btnImport">📥 وارد کردن پشتیبان</button>
  </div>
  <div class="row">
    <button class="neutral" id="btnEmptyTemplate">📝 ساخت JSON خالی</button>
    <button class="danger" id="btnResetAll">🗑 ریست کامل</button>
  </div>
  <div class="row">
    <button class="neutral" id="btnShowStorageInfo">ℹ️ وضعیت ذخیره‌سازی</button>
  </div>
  <input type="file" id="fileInput" accept=".json" style="display:none">
  <input type="file" id="fileInputCards" accept=".json" style="display:none">
</div>

<div class="menu" id="mainMenu">
  <h2>🎯 حالت مرور</h2>
  <div class="grid">
    <button data-mode="all">🗂 همه<small id="cntAll"></small></button>
    <button data-mode="random">🎲 تصادفی<small id="cntAll2"></small></button>
    <button data-mode="due">⏰ سررسیده‌ها<small id="cntDue"></small></button>
    <button data-mode="new">🆕 کارت‌های جدید<small id="cntNew"></small></button>
    <button data-mode="today">📅 امروزی‌ها<small id="cntToday"></small></button>
    <button data-mode="todayWrong">🔴 غلط‌های امروز<small id="cntTodayWrong"></small></button>
    <button data-mode="hard">🔁 سخت‌ها<small id="cntHard"></small></button>
    <button data-mode="starred">⭐ ستاره‌دارها<small id="cntStar"></small></button>
    <button data-mode="suspended">⏸ تعلیق‌شده‌ها<small id="cntSusp"></small></button>
    <button data-mode="deleted">🗑 حذف‌شده‌ها<small id="cntDel"></small></button>
    <button id="btnTopicsMenu">📚 درس‌ها<small id="cntTopics"></small></button>
    <button id="btnSubjectSearch">🔍 جستجوی موضوعی<small>درس و مبحث</small></button>
  </div>
</div>

<div class="welcome" id="welcome"></div>

<div class="stats-bar">
  <div class="stat c"><div class="num" id="sCorrect">0</div><div class="lbl">✅ درست</div></div>
  <div class="stat p"><div class="num" id="sPartial">0</div><div class="lbl">🟡 حدودی</div></div>
  <div class="stat w"><div class="num" id="sWrong">0</div><div class="lbl">🔴 غلط</div></div>
  <div class="stat rm"><div class="num" id="sRemaining">0</div><div class="lbl">باقی‌مانده</div></div>
  <div class="stat pr"><div class="num" id="sProgress">0%</div><div class="lbl">پیشرفت</div></div>
</div>

<div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

<div class="card" id="card">
  <div class="meta">
    <span id="cardIndex"></span>
    <span id="cardDue"></span>
  </div>
  <div class="star" id="starBtn">☆</div>
  <div class="question" id="question"></div>
  <div class="hint">برای دیدن پاسخ روی کارت بزنید</div>
  <div class="answer" id="answer"></div>
  <div class="viewcount" id="viewCount"></div>
  <div class="tools">
    <button id="btnSuspend">⏸ تعلیق</button>
    <button id="btnDelete">🗑 حذف</button>
  </div>
</div>

<div class="actions" id="actions">
  <button class="btn-correct" id="btnCorrect">✅ درست</button>
  <button class="btn-partial" id="btnPartial">🟡 حدودی</button>
  <button class="btn-wrong" id="btnWrong">🔴 غلط</button>
  <button class="btn-skip" id="btnSkip">⏭</button>
</div>

<div class="nav-row">
  <button id="btnPrev">◀ قبلی</button>
  <button id="btnNext">بعدی ▶</button>
</div>

<div class="summary" id="summary">
  <h2>🎉 پایان مرور — خلاصه عملکرد</h2>
  <div class="big" id="sumPct">0%</div>
  <div class="row">
    <div><div class="num" id="sumCorrect" style="color:#4ade80">0</div><div class="lbl">درست</div></div>
    <div><div class="num" id="sumPartial" style="color:#fbbf24">0</div><div class="lbl">حدودی</div></div>
    <div><div class="num" id="sumWrong" style="color:#f87171">0</div><div class="lbl">غلط</div></div>
    <div><div class="num" id="sumTotal" style="color:#60a5fa">0</div><div class="lbl">کل</div></div>
  </div>
  <div class="weekly-chart" id="weeklyChart"></div>
  <button id="btnBackMenu2">🏠 بازگشت به منو</button>
</div>

<div class="panel" id="topicsPanel">
  <button class="close-btn" id="btnCloseTopics">✕ بستن</button>
  <h2>📚 درس‌ها و مبحث‌ها</h2>
  <div class="top-actions">
    <button class="green" id="btnAddTopic">➕ درس جدید</button>
    <button class="purple" id="btnReviewSelected">▶ مرور مبحث‌های انتخاب‌شده</button>
    <button class="neutral" id="btnUploadTopic">📁 بارگذاری JSON</button>
    <button class="neutral" id="btnExportTopics">📤 خروجی درس‌ها</button>
  </div>
  <div id="topicsList"></div>
</div>

<div class="panel" id="subjectSearchPanel">
  <button class="close-btn" id="btnCloseSubjectSearch">✕ بستن</button>
  <h2>🔍 جستجوی موضوعی</h2>
  <div class="top-actions">
    <input type="text" id="subjectSearchInput" placeholder="نام درس یا مبحث..." style="flex:1;padding:7px 10px;border-radius:7px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-family:inherit;font-size:.82rem">
  </div>
  <div id="subjectSearchResults"></div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

<div class="panel" id="topicPanel" style="display:none">
  <button class="close-btn" id="btnCloseTopicDetail">✕ بستن</button>
  <h2 id="topicDetailTitle"></h2>
  <div class="top-actions">
    <button class="green" id="btnAddSubtopic">➕ مبحث جدید</button>
    <button class="purple" id="btnReviewSubtopic">▶ مرور همه مبحث‌ها</button>
    <button class="neutral" id="btnExportTopic">📤 خروجی این درس</button>
  </div>

<div class="panel" id="subtopicPanel" style="display:none">
  <button class="close-btn" id="btnCloseSubtopicDetail">✕ بستن</button>

    <button class="green" id="btnAddCard">➕ کارت جدید</button>
    <button class="purple" id="btnReviewThisSubtopic">▶ مرور این مبحث</button>

</div>

<script>const DEFAULT_SETTINGS={partialDays:2,correctSteps:[3,7,14,26,58,125],wrongDays:1,hardThreshold:3};
let SETTINGS=JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
const STORAGE_KEY='fc_v5_state';
const SETTINGS_KEY='fc_v5_settings';
const TOPICS_KEY='fc_v5_topics';
const THEME_KEY='fc_v5_theme';
const BACKUP_KEY='fc_v5_backup';
const IDB_NAME='fc_v5_db';
const IDB_STORE='state';
let STATE=null;
let TOPICS=[];
function emptyCardState(){return{seen:false,lastSeen:null,nextDue:null,correctCount:0,partialCount:0,wrongCount:0,totalWrong:0,stepIndex:0,starred:false,suspended:false,deleted:false,viewCount:0,lastWrongDate:null}}
function freshState(){return{cards:{},history:{},lastModified:Date.now()}}
function makeId(){return'id_'+Date.now()+'_'+Math.random().toString(36).slice(2,8)}
function saveLS(key,data){try{localStorage.setItem(key,JSON.stringify(data));return true}catch(e){return false}}
function loadLS(key){try{const r=localStorage.getItem(key);return r?JSON.parse(r):null}catch(e){return null}}
function saveSS(key,data){try{sessionStorage.setItem(key,JSON.stringify(data))}catch(e){}}
function loadSS(key){try{const r=sessionStorage.getItem(key);return r?JSON.parse(r):null}catch(e){return null}}
let idb=null;
function openIDB(){return new Promise((res,rej)=>{const r=indexedDB.open(IDB_NAME,1);r.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains(IDB_STORE))db.createObjectStore(IDB_STORE)};r.onsuccess=e=>{idb=e.target.result;res(idb)};r.onerror=e=>rej(e.target.error)})}
function saveIDB(data){if(!idb)return Promise.resolve(false);return new Promise(res=>{try{const tx=idb.transaction(IDB_STORE,'readwrite');tx.objectStore(IDB_STORE).put(data,'main');tx.oncomplete=()=>res(true);tx.onerror=()=>res(false)}catch(e){res(false)}})}
function loadIDB(){if(!idb)return Promise.resolve(null);return new Promise(res=>{try{const tx=idb.transaction(IDB_STORE,'readonly');const rq=tx.objectStore(IDB_STORE).get('main');rq.onsuccess=()=>res(rq.result||null);rq.onerror=()=>res(null)}catch(e){res(null)}})}
let saveStatus={ls:false,idb:false,lastSave:null};
let saveCounter=0;
async function saveState(silent){if(!STATE)return;STATE.lastModified=Date.now();saveCounter++;const lsOk=saveLS(STORAGE_KEY,STATE);saveStatus.ls=lsOk;saveSS(STORAGE_KEY,STATE);let idbOk=false;if(saveCounter%3===0||saveCounter===1){idbOk=await saveIDB(STATE);saveStatus.idb=idbOk}else idbOk=saveStatus.idb;saveStatus.lastSave=new Date();if(!silent)showSaveIndicator(lsOk,idbOk)}
function saveTopics(){saveLS(TOPICS_KEY,TOPICS);saveSS(TOPICS_KEY,TOPICS)}
function showSaveIndicator(ls,idb){const el=document.getElementById('saveIndicator');if(!el)return;el.className='save-indicator';if(ls&&idb){el.textContent='✅ ذخیره شد — '+new Date().toLocaleTimeString('fa-IR');el.classList.add('ok')}else if(ls||idb){el.textContent='🟡 ذخیره (یک لایه) — '+new Date().toLocaleTimeString('fa-IR');el.classList.add('warn')}else{el.textContent='❌ ذخیره نشد! لطفاً خروجی بگیرید';el.classList.add('err')}clearTimeout(window._saveTimer);window._saveTimer=setTimeout(()=>{el.textContent='آماده';el.className='save-indicator'},3500)}
function showAlert(msg,type){const el=document.getElementById('alertBar');if(!el)return;el.textContent=msg;el.className='alert-bar show '+(type||'');clearTimeout(window._alertTimer);window._alertTimer=setTimeout(()=>{el.classList.remove('show')},4000)}
async function loadState(){let d=loadLS(STORAGE_KEY);if(!d)d=await loadIDB();if(!d)d=loadSS(STORAGE_KEY);if(!d)d=freshState();if(!d.cards)d.cards={};if(!d.history)d.history={};return d}
function loadTopics(){let t=loadLS(TOPICS_KEY);if(!t)t=loadSS(TOPICS_KEY);if(!t)t=[];return t}
function loadSettings(){try{const s=loadLS(SETTINGS_KEY);if(s){if(s.partialDays)SETTINGS.partialDays=s.partialDays;if(s.correctSteps&&Array.isArray(s.correctSteps))SETTINGS.correctSteps=s.correctSteps;if(s.wrongDays)SETTINGS.wrongDays=s.wrongDays;if(s.hardThreshold)SETTINGS.hardThreshold=s.hardThreshold}}catch(e){}document.getElementById('setPartial').value=SETTINGS.partialDays;document.getElementById('setCorrect').value=SETTINGS.correctSteps.join(',');document.getElementById('setWrong').value=SETTINGS.wrongDays;document.getElementById('setHardThreshold').value=SETTINGS.hardThreshold}
const $=id=>document.getElementById(id);
const today=()=>new Date().toISOString().slice(0,10);
function addDays(dateStr,days){const d=new Date(dateStr);d.setDate(d.getDate()+days);return d.toISOString().slice(0,10)}
function daysBetween(a,b){return Math.round((new Date(b)-new Date(a))/86400000)}
function daysUntil(d){return daysBetween(today(),d)}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function cardKey(q,a){return(q||'').trim()+'|||'+(a||'').trim()}
function getAllCards(){const list=[];TOPICS.forEach(t=>{(t.subtopics||[]).forEach(st=>{(st.cards||[]).forEach(c=>{list.push({key:cardKey(c.q,c.a),q:c.q,a:c.a,topicId:t.id,topicName:t.name,subtopicId:st.id,subtopicName:st.name})})})});return list}
function findCardByKey(key){const all=getAllCards();return all.find(x=>x.key===key)}
function getCardState(key){if(!STATE.cards[key])STATE.cards[key]=emptyCardState();return STATE.cards[key]}
function updateClock(){const d=new Date();$('clock').textContent=d.toLocaleDateString('fa-IR')+' — '+d.toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'})}
setInterval(updateClock,1000);updateClock();
function isActive(key){const s=getCardState(key);return!s.deleted&&!s.suspended}
function isDeleted(key){return getCardState(key).deleted===true}
function isSuspended(key){return getCardState(key).suspended===true}
function isNew(key){const s=getCardState(key);return!s.seen&&!s.deleted&&!s.suspended}
function isDue(key){const s=getCardState(key);if(s.deleted||s.suspended)return false;if(!s.seen||!s.nextDue)return false;return s.nextDue<=today()}
function isHard(key){const s=getCardState(key);return!s.deleted&&!s.suspended&&s.totalWrong>=SETTINGS.hardThreshold}
function isStarred(key){const s=getCardState(key);return!s.deleted&&!s.suspended&&s.starred===true}
function isTodaySeen(key){const s=getCardState(key);return!s.deleted&&!s.suspended&&s.lastSeen===today()}
function isTodayWrong(key){const s=getCardState(key);return!s.deleted&&!s.suspended&&s.lastWrongDate===today()}
function countBy(fn){const all=getAllCards();let n=0;all.forEach(c=>{if(fn(c.key))n++});return n}
function updateMenuCounts(){const total=getAllCards().length;$('cntAll').textContent=countBy(isActive)+' کارت';$('cntAll2').textContent=countBy(isActive)+' کارت';$('cntDue').textContent=countBy(isDue)+' کارت';$('cntNew').textContent=countBy(isNew)+' کارت';$('cntToday').textContent=countBy(isTodaySeen)+' کارت';$('cntTodayWrong').textContent=countBy(isTodayWrong)+' کارت';$('cntHard').textContent=countBy(isHard)+' کارت';$('cntStar').textContent=countBy(isStarred)+' کارت';$('cntSusp').textContent=countBy(isSuspended)+' کارت';$('cntDel').textContent=countBy(isDeleted)+' کارت';$('cntTopics').textContent=TOPICS.length+' درس';if(total===0){$('welcome').className='welcome empty';$('welcome').textContent='📭 هنوز کارتی نداری. از منوی «📚 درس‌ها» شروع کن یا فایل JSON بارگذاری کن.'}else{$('welcome').className='welcome';const d=countBy(isDue),n=countBy(isNew);$('welcome').innerHTML=`📅 امروز <b>${d}</b> کارت سررسیده و <b>${n}</b> کارت جدید داری.`}}
function overallProgress(){const all=getAllCards();if(all.length===0)return 0;let m=0;all.forEach(c=>{if(getCardState(c.key).correctCount>0)m++});return Math.round(m/all.length*100)}
function buildQueue(mode,filterKeys){const all=getAllCards();let keys=[];all.forEach(c=>{if(filterKeys&&!filterKeys.includes(c.key))return;if(mode==='all'&&isActive(c.key))keys.push(c.key);else if(mode==='random'&&isActive(c.key))keys.push(c.key);else if(mode==='due'&&isDue(c.key))keys.push(c.key);else if(mode==='new'&&isNew(c.key))keys.push(c.key);else if(mode==='today'&&isTodaySeen(c.key))keys.push(c.key);else if(mode==='todayWrong'&&isTodayWrong(c.key))keys.push(c.key);else if(mode==='hard'&&isHard(c.key))keys.push(c.key);else if(mode==='starred'&&isStarred(c.key))keys.push(c.key);else if(mode==='suspended'&&isSuspended(c.key))keys.push(c.key);else if(mode==='deleted'&&isDeleted(c.key))keys.push(c.key);else if(mode==='custom'&&isActive(c.key))keys.push(c.key)});if(mode==='random')keys=shuffle(keys);return keys}
let session={mode:'all',queue:[],current:0,revealed:false,stats:{correct:0,partial:0,wrong:0},restoreMode:false};
function startSession(mode,filterKeys){const q=buildQueue(mode,filterKeys);if(q.length===0){showAlert('کارتی برای این حالت وجود ندارد.','warn');return}session={mode,queue:q,current:0,revealed:false,stats:{correct:0,partial:0,wrong:0},restoreMode:(mode==='suspended'||mode==='deleted')};$('mainMenu').style.display='none';$('topicsPanel').classList.remove('show');$('subjectSearchPanel').classList.remove('show');$('topicPanel').classList.remove('show');$('subtopicPanel').classList.remove('show');$('summary').classList.remove('show');$('card').style.display='flex';$('actions').style.display='flex';document.querySelector('.nav-row').style.display='flex';render()}
function render(){if(session.queue.length===0){showSummary();return}const key=session.queue[session.current];const cardData=findCardByKey(key);if(!cardData){nextCard();return}const s=getCardState(key);$('cardIndex').textContent=`کارت ${session.current+1} از ${session.queue.length}`;$('question').textContent=cardData.q;$('answer').innerHTML=`<div class="answer-label">پاسخ</div>${cardData.a}`;let dueText='';if(s.deleted)dueText='🗑 حذف‌شده';else if(s.suspended)dueText='⏸ معلق';else if(!s.seen)dueText='🆕 جدید';else if(s.nextDue){const d=daysUntil(s.nextDue);if(d<=0)dueText='⏰ سررسیده';else if(d===1)dueText='فردا';else dueText=`${d} روز دیگر`}const ctxText=cardData.topicName?`${cardData.topicName} › ${cardData.subtopicName}`:'';$('cardDue').textContent=(ctxText?ctxText+' | ':'')+dueText;$('viewCount').textContent=s.viewCount>0?`👁 ${s.viewCount} بار`:'';$('starBtn').textContent=s.starred?'★':'☆';$('starBtn').classList.toggle('on',s.starred);$('btnSuspend').textContent=s.suspended?'▶ بازگرداندن':'⏸ تعلیق';$('btnDelete').textContent=s.deleted?'↩ بازگرداندن':'🗑 حذف';session.revealed=false;$('card').classList.remove('revealed');$('actions').classList.remove('show');$('btnPrev').disabled=session.current===0;$('btnNext').disabled=session.current===session.queue.length-1;updateStats()}
function updateStats(){const st=session.stats;$('sCorrect').textContent=st.correct;$('sPartial').textContent=st.partial;$('sWrong').textContent=st.wrong;$('sRemaining').textContent=session.queue.length-session.current-1;const p=overallProgress();$('sProgress').textContent=p+'%';$('progressFill').style.width=p+'%'}
function answerCard(type){const key=session.queue[session.current];const s=getCardState(key);const td=today();if(s.deleted||s.suspended){nextCard();return}s.seen=true;s.lastSeen=td;s.viewCount=(s.viewCount||0)+1;if(type==='correct'){s.correctCount++;const si=Math.min(s.stepIndex,SETTINGS.correctSteps.length-1);s.nextDue=addDays(td,SETTINGS.correctSteps[si]);s.stepIndex=Math.min(s.stepIndex+1,SETTINGS.correctSteps.length-1);session.stats.correct++}else if(type==='partial'){s.partialCount++;s.nextDue=addDays(td,SETTINGS.partialDays);session.stats.partial++}else if(type==='wrong'){s.wrongCount++;s.totalWrong++;s.nextDue=addDays(td,SETTINGS.wrongDays);s.stepIndex=0;s.lastWrongDate=td;session.stats.wrong++}if(!STATE.history[td])STATE.history[td]={correct:0,partial:0,wrong:0};STATE.history[td][type]++;saveState(true);const tot=session.stats.correct+session.stats.partial+session.stats.wrong;if(tot%5===0)showSaveIndicator(saveStatus.ls,saveStatus.idb);nextCard()}
function nextCard(){if(session.current<session.queue.length-1){session.current++;render()}else{showSummary()}}
function showSummary(){const st=session.stats;const total=st.correct+st.partial+st.wrong;const pct=total?Math.round(st.correct/total*100):0;$('sumPct').textContent=pct+'%';$('sumCorrect').textContent=st.correct;$('sumPartial').textContent=st.partial;$('sumWrong').textContent=st.wrong;$('sumTotal').textContent=total;const chart=$('weeklyChart');chart.innerHTML='';for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const ds=d.toISOString().slice(0,10);const h=STATE.history[ds]||{correct:0,partial:0,wrong:0};const sum=h.correct+h.partial+h.wrong;const w=document.createElement('div');w.style.flex='1';const b=document.createElement('div');b.className='bar';b.style.height=Math.max(3,Math.min(45,sum*5))+'px';b.title=`${ds}: ${sum} مرور`;const l=document.createElement('div');l.className='bar-lbl';l.textContent=ds.slice(8,10);w.appendChild(b);w.appendChild(l);chart.appendChild(w)}$('card').style.display='none';$('actions').style.display='none';document.querySelector('.nav-row').style.display='none';$('summary').classList.add('show');updateMenuCounts()}
$('card').addEventListener('click',e=>{if(e.target.closest('.star')||e.target.closest('.tools'))return;if(session.revealed)return;session.revealed=true;$('card').classList.add('revealed');$('actions').classList.add('show')});
$('btnCorrect').addEventListener('click',()=>answerCard('correct'));
$('btnPartial').addEventListener('click',()=>answerCard('partial'));
$('btnWrong').addEventListener('click',()=>answerCard('wrong'));
$('btnSkip').addEventListener('click',()=>nextCard());
$('btnPrev').addEventListener('click',()=>{if(session.current>0){session.current--;render()}});
$('btnNext').addEventListener('click',()=>{if(session.current<session.queue.length-1){session.current++;render()}});
$('starBtn').addEventListener('click',e=>{e.stopPropagation();const key=session.queue[session.current];const s=getCardState(key);s.starred=!s.starred;saveState(true);$('starBtn').textContent=s.starred?'★':'☆';$('starBtn').classList.toggle('on',s.starred);updateMenuCounts()});
$('btnSuspend').addEventListener('click',e=>{e.stopPropagation();const key=session.queue[session.current];const s=getCardState(key);if(s.deleted){showAlert('این کارت حذف شده است.','warn');return}if(s.suspended){s.suspended=false;saveState(true);showAlert('✅ کارت بازگردانده شد.','ok')}else{if(!confirm('این کارت معلق شود؟ از همه منوها مخفی می‌شود.'))return;s.suspended=true;saveState(true);showAlert('⏸ کارت معلق شد.','warn')}render();updateMenuCounts()});
$('btnDelete').addEventListener('click',e=>{e.stopPropagation();const key=session.queue[session.current];const s=getCardState(key);if(s.deleted){s.deleted=false;saveState(true);showAlert('✅ کارت بازگردانده شد.','ok')}else{if(!confirm('این کارت حذف شود؟ از همه منوها مخفی می‌شود ولی قابل بازگرداندن است.'))return;s.deleted=true;saveState(true);showAlert('🗑 کارت حذف شد.','warn')}render();updateMenuCounts()});
document.querySelectorAll('.menu button[data-mode]').forEach(b=>{b.addEventListener('click',()=>startSession(b.dataset.mode))});
function goMenu(){$('mainMenu').style.display='block';$('summary').classList.remove('show');$('topicsPanel').classList.remove('show');$('subjectSearchPanel').classList.remove('show');$('topicPanel').classList.remove('show');$('subtopicPanel').classList.remove('show');$('card').style.display='none';$('actions').style.display='none';document.querySelector('.nav-row').style.display='none';updateMenuCounts()}
$('btnBackMenu').addEventListener('click',goMenu);
$('btnBackMenu2').addEventListener('click',goMenu);function showTopicsPanel(){$('mainMenu').style.display='none';$('topicPanel').classList.remove('show');$('subtopicPanel').classList.remove('show');$('subjectSearchPanel').classList.remove('show');$('card').style.display='none';$('actions').style.display='none';document.querySelector('.nav-row').style.display='none';$('summary').classList.remove('show');$('topicsPanel').classList.add('show');renderTopicsList()}
function renderTopicsList(){const wrap=$('topicsList');if(TOPICS.length===0){wrap.innerHTML='<div style="text-align:center;padding:24px;color:var(--mt)">هنوز درسی ساخته نشده. روی «➕ درس جدید» بزنید یا فایل JSON بارگذاری کنید.</div>';return}wrap.innerHTML=TOPICS.map(t=>{const subCount=(t.subtopics||[]).length;const cardCount=(t.subtopics||[]).reduce((s,st)=>s+(st.cards||[]).length,0);return`<div class="topic-item" data-topic="${t.id}"><div class="head"><div class="name" data-toggle="${t.id}"><span class="arrow">▶</span><span>📚 ${escapeHtml(t.name)}</span><span style="font-size:.7rem;color:var(--mt)">(${subCount} مبحث، ${cardCount} کارت)</span></div><div class="actions"><button class="primary" data-review-topic="${t.id}">▶ مرور درس</button><button data-add-sub="${t.id}">➕ مبحث</button><button data-edit-topic="${t.id}">✏ ویرایش</button><button data-export-topic="${t.id}">📤 خروجی</button><button class="danger" data-del-topic="${t.id}">🗑</button></div></div><div class="subtopics" id="subs_${t.id}">${renderSubtopics(t)}</div></div>`}).join('');bindTopicsEvents()}
function renderSubtopics(topic){if(!topic.subtopics||topic.subtopics.length===0){return'<div style="text-align:center;padding:10px;color:var(--mt);font-size:.78rem">مبحثی ندارد</div>'}return topic.subtopics.map(st=>`<div class="subtopic-item"><input type="checkbox" data-sub-check="${topic.id}|${st.id}"><div class="sub-name">📂 ${escapeHtml(st.name)} <span class="card-count">${(st.cards||[]).length} کارت</span></div><div class="sub-actions"><button class="primary" data-review-sub="${topic.id}|${st.id}">▶ مرور</button><button data-add-card="${topic.id}|${st.id}">➕ کارت</button><button data-edit-sub="${topic.id}|${st.id}">✏</button><button data-export-sub="${topic.id}|${st.id}">📤</button><button class="danger" data-del-sub="${topic.id}|${st.id}">🗑</button></div></div>`).join('')}
function escapeHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function bindTopicsEvents(){document.querySelectorAll('[data-toggle]').forEach(el=>{el.addEventListener('click',()=>{const item=el.closest('.topic-item');item.classList.toggle('open')})});document.querySelectorAll('[data-review-topic]').forEach(b=>{b.addEventListener('click',()=>{const t=TOPICS.find(x=>x.id===b.dataset.reviewTopic);if(!t)return;const keys=[];(t.subtopics||[]).forEach(st=>(st.cards||[]).forEach(c=>keys.push(cardKey(c.q,c.a))));if(keys.length===0){showAlert('این درس کارتی ندارد.','warn');return}startSession('custom',keys)})});document.querySelectorAll('[data-review-sub]').forEach(b=>{b.addEventListener('click',()=>{const[tid,sid]=b.dataset.reviewSub.split('|');const t=TOPICS.find(x=>x.id===tid);if(!t)return;const st=(t.subtopics||[]).find(x=>x.id===sid);if(!st)return;const keys=(st.cards||[]).map(c=>cardKey(c.q,c.a));if(keys.length===0){showAlert('این مبحث کارتی ندارد.','warn');return}startSession('custom',keys)})});document.querySelectorAll('[data-add-sub]').forEach(b=>{b.addEventListener('click',()=>openSubtopicModal(b.dataset.addSub,null))});document.querySelectorAll('[data-edit-topic]').forEach(b=>{b.addEventListener('click',()=>openTopicModal(b.dataset.editTopic))});document.querySelectorAll('[data-del-topic]').forEach(b=>{b.addEventListener('click',()=>{const t=TOPICS.find(x=>x.id===b.dataset.delTopic);if(!t)return;if(!confirm(`درس «${t.name}» و همه مبحث‌های آن حذف شود؟`))return;TOPICS=TOPICS.filter(x=>x.id!==b.dataset.delTopic);saveTopics();renderTopicsList();updateMenuCounts();showAlert('🗑 درس حذف شد.','warn')})});document.querySelectorAll('[data-add-card]').forEach(b=>{b.addEventListener('click',()=>{const[tid,sid]=b.dataset.addCard.split('|');openCardModal(tid,sid,null)})});document.querySelectorAll('[data-edit-sub]').forEach(b=>{b.addEventListener('click',()=>{const[tid,sid]=b.dataset.editSub.split('|');openSubtopicModal(tid,sid)})});document.querySelectorAll('[data-del-sub]').forEach(b=>{b.addEventListener('click',()=>{const[tid,sid]=b.dataset.delSub.split('|');const t=TOPICS.find(x=>x.id===tid);if(!t)return;const st=(t.subtopics||[]).find(x=>x.id===sid);if(!st)return;if(!confirm(`مبحث «${st.name}» حذف شود؟`))return;t.subtopics=t.subtopics.filter(x=>x.id!==sid);saveTopics();renderTopicsList();updateMenuCounts()})});document.querySelectorAll('[data-export-topic]').forEach(b=>{b.addEventListener('click',()=>{const t=TOPICS.find(x=>x.id===b.dataset.exportTopic);if(!t)return;exportTopicJSON(t)})});document.querySelectorAll('[data-export-sub]').forEach(b=>{b.addEventListener('click',()=>{const[tid,sid]=b.dataset.exportSub.split('|');const t=TOPICS.find(x=>x.id===tid);if(!t)return;const st=(t.subtopics||[]).find(x=>x.id===sid);if(!st)return;exportSubtopicJSON(t,st)})})}
$('btnReviewSelected').addEventListener('click',()=>{const checks=document.querySelectorAll('[data-sub-check]:checked');if(checks.length===0){showAlert('هیچ مبحثی انتخاب نشده.','warn');return}const keys=[];checks.forEach(ch=>{const[tid,sid]=ch.dataset.subCheck.split('|');const t=TOPICS.find(x=>x.id===tid);if(!t)return;const st=(t.subtopics||[]).find(x=>x.id===sid);if(!st)return;(st.cards||[]).forEach(c=>keys.push(cardKey(c.q,c.a)))});if(keys.length===0){showAlert('مبحث‌های انتخابی کارتی ندارند.','warn');return}startSession('custom',keys)});
$('btnAddTopic').addEventListener('click',()=>openTopicModal(null));
function openTopicModal(topicId){const t=topicId?TOPICS.find(x=>x.id===topicId):null;const modal=$('modalContent');modal.innerHTML=`<h3>${t?'✏ ویرایش درس':'➕ درس جدید'}</h3><label>نام درس</label><input type="text" id="modalTopicName" value="${t?escapeHtml(t.name):''}" placeholder="مثلاً: آناتومی قفسه سینه"><div class="row"><button class="primary" id="modalSaveTopic">💾 ذخیره</button><button class="neutral" id="modalCancelTopic">انصراف</button></div>`;$('modalOverlay').classList.add('show');$('modalTopicName').focus();$('modalCancelTopic').addEventListener('click',closeModal);$('modalSaveTopic').addEventListener('click',()=>{const name=$('modalTopicName').value.trim();if(!name){alert('نام درس را وارد کنید.');return}if(t){t.name=name}else{TOPICS.push({id:makeId(),name,subtopics:[]})}saveTopics();closeModal();renderTopicsList();updateMenuCounts();showAlert('✅ ذخیره شد.','ok')})}
function openSubtopicModal(topicId,subtopicId){const t=TOPICS.find(x=>x.id===topicId);if(!t){showAlert('درس پیدا نشد.','err');return}const st=subtopicId?(t.subtopics||[]).find(x=>x.id===subtopicId):null;const modal=$('modalContent');modal.innerHTML=`<h3>${st?'✏ ویرایش مبحث':'➕ مبحث جدید'}</h3><label>نام مبحث</label><input type="text" id="modalSubName" value="${st?escapeHtml(st.name):''}" placeholder="مثلاً: استخوان‌شناسی"><div class="row"><button class="primary" id="modalSaveSub">💾 ذخیره</button><button class="neutral" id="modalCancelSub">انصراف</button></div>`;$('modalOverlay').classList.add('show');$('modalSubName').focus();$('modalCancelSub').addEventListener('click',closeModal);$('modalSaveSub').addEventListener('click',()=>{const name=$('modalSubName').value.trim();if(!name){alert('نام مبحث را وارد کنید.');return}if(!t.subtopics)t.subtopics=[];if(st){st.name=name}else{t.subtopics.push({id:makeId(),name,cards:[]})}saveTopics();closeModal();renderTopicsList();updateMenuCounts();showAlert('✅ ذخیره شد.','ok')})}
function openCardModal(topicId,subtopicId,cardKeyOld){const t=TOPICS.find(x=>x.id===topicId);if(!t){showAlert('درس پیدا نشد.','err');return}const st=(t.subtopics||[]).find(x=>x.id===subtopicId);if(!st){showAlert('مبحث پیدا نشد.','err');return}const cards=st.cards||[];const idx=cardKeyOld?cards.findIndex(c=>cardKey(c.q,c.a)===cardKeyOld):-1;const oldCard=idx>=0?cards[idx]:null;const modal=$('modalContent');modal.innerHTML=`<h3>${oldCard?'✏ ویرایش کارت':'➕ کارت جدید'}</h3><label>سؤال</label><textarea id="modalQ" rows="3" placeholder="متن سؤال...">${oldCard?escapeHtml(oldCard.q):''}</textarea><label>پاسخ</label><textarea id="modalA" rows="3" placeholder="متن پاسخ...">${oldCard?escapeHtml(oldCard.a):''}</textarea><div class="row"><button class="primary" id="modalSaveCard">💾 ذخیره</button><button class="neutral" id="modalCancelCard">انصراف</button></div>`;$('modalOverlay').classList.add('show');$('modalQ').focus();$('modalCancelCard').addEventListener('click',closeModal);$('modalSaveCard').addEventListener('click',()=>{const q=$('modalQ').value.trim();const a=$('modalA').value.trim();if(!q||!a){alert('سؤال و پاسخ را وارد کنید.');return}if(oldCard){oldCard.q=q;oldCard.a=a}else{const k=cardKey(q,a);const exists=getAllCards().some(c=>c.key===k);if(exists){showAlert('این کارت قبلاً وجود دارد.','warn');return}if(!st.cards)st.cards=[];st.cards.push({q,a})}saveTopics();closeModal();renderTopicsList();if($('subtopicPanel').classList.contains('show'))renderSubtopicDetail();updateMenuCounts();showAlert('✅ ذخیره شد.','ok')})}
function closeModal(){$('modalOverlay').classList.remove('show')}
$('modalOverlay').addEventListener('click',e=>{if(e.target.id==='modalOverlay')closeModal()});
let currentTopicId=null;
let currentSubtopicId=null;
function openSubtopicDetail(topicId,subtopicId){currentTopicId=topicId;currentSubtopicId=subtopicId;const t=TOPICS.find(x=>x.id===topicId);if(!t)return;const st=(t.subtopics||[]).find(x=>x.id===subtopicId);if(!st)return;$('mainMenu').style.display='none';$('topicsPanel').classList.remove('show');$('topicPanel').classList.remove('show');$('subtopicPanel').classList.add('show');$('subtopicDetailTitle').textContent=`📂 ${t.name} › ${st.name}`;renderSubtopicDetail()}
function renderSubtopicDetail(){const t=TOPICS.find(x=>x.id===currentTopicId);if(!t)return;const st=(t.subtopics||[]).find(x=>x.id===currentSubtopicId);if(!st)return;const cards=st.cards||[];const wrap=$('cardsList');if(cards.length===0){wrap.innerHTML='<div style="text-align:center;padding:20px;color:var(--mt)">هنوز کارتی ندارد.</div>';return}wrap.innerHTML=cards.map((c,i)=>`<div class="subtopic-item"><div class="sub-name">🃏 <b>${i+1}.</b> ${escapeHtml(c.q.slice(0,70))}${c.q.length>70?'…':''}</div><div class="sub-actions"><button data-edit-card="${i}">✏ ویرایش</button><button class="danger" data-del-card="${i}">🗑</button></div></div>`).join('');wrap.querySelectorAll('[data-edit-card]').forEach(b=>{b.addEventListener('click',()=>{const i=parseInt(b.dataset.editCard);openCardModal(currentTopicId,currentSubtopicId,cardKey(cards[i].q,cards[i].a))})});wrap.querySelectorAll('[data-del-card]').forEach(b=>{b.addEventListener('click',()=>{const i=parseInt(b.dataset.delCard);if(!confirm('این کارت حذف شود؟'))return;const k=cardKey(cards[i].q,cards[i].a);cards.splice(i,1);delete STATE.cards[k];saveTopics();saveState(true);renderSubtopicDetail();updateMenuCounts()})})}
$('btnAddCard').addEventListener('click',()=>openCardModal(currentTopicId,currentSubtopicId,null));
$('btnReviewThisSubtopic').addEventListener('click',()=>{const t=TOPICS.find(x=>x.id===currentTopicId);if(!t)return;const st=(t.subtopics||[]).find(x=>x.id===currentSubtopicId);if(!st)return;const keys=(st.cards||[]).map(c=>cardKey(c.q,c.a));if(keys.length===0){showAlert('این مبحث کارتی ندارد.','warn');return}startSession('custom',keys)});
$('btnExportSubtopic').addEventListener('click',()=>{const t=TOPICS.find(x=>x.id===currentTopicId);if(!t)return;const st=(t.subtopics||[]).find(x=>x.id===currentSubtopicId);if(!st)return;exportSubtopicJSON(t,st)});
$('btnCloseSubtopicDetail').addEventListener('click',()=>{$('subtopicPanel').classList.remove('show');showTopicsPanel()});
let currentTopicDetailId=null;
function openTopicDetail(topicId){currentTopicDetailId=topicId;const t=TOPICS.find(x=>x.id===topicId);if(!t)return;$('mainMenu').style.display='none';$('topicsPanel').classList.remove('show');$('subtopicPanel').classList.remove('show');$('topicPanel').classList.add('show');$('topicDetailTitle').textContent=`📚 ${t.name}`;renderTopicDetail()}
function renderTopicDetail(){const t=TOPICS.find(x=>x.id===currentTopicDetailId);if(!t)return;const wrap=$('subtopicsList');const subs=t.subtopics||[];if(subs.length===0){wrap.innerHTML='<div style="text-align:center;padding:20px;color:var(--mt)">هنوز مبحثی ندارد.</div>';return}wrap.innerHTML=subs.map(st=>`<div class="subtopic-item"><div class="sub-name">📂 ${escapeHtml(st.name)} <span class="card-count">${(st.cards||[]).length} کارت</span></div><div class="sub-actions"><button class="primary" data-open-sub="${st.id}">📋 نمایش کارت‌ها</button><button data-add-card2="${st.id}">➕ کارت</button><button data-edit-sub2="${st.id}">✏</button><button class="danger" data-del-sub2="${st.id}">🗑</button></div></div>`).join('');wrap.querySelectorAll('[data-open-sub]').forEach(b=>{b.addEventListener('click',()=>openSubtopicDetail(currentTopicDetailId,b.dataset.openSub))});wrap.querySelectorAll('[data-add-card2]').forEach(b=>{b.addEventListener('click',()=>openCardModal(currentTopicDetailId,b.dataset.addCard2,null))});wrap.querySelectorAll('[data-edit-sub2]').forEach(b=>{b.addEventListener('click',()=>openSubtopicModal(currentTopicDetailId,b.dataset.editSub2))});wrap.querySelectorAll('[data-del-sub2]').forEach(b=>{b.addEventListener('click',()=>{if(!confirm('مبحث حذف شود؟'))return;t.subtopics=t.subtopics.filter(x=>x.id!==b.dataset.delSub2);saveTopics();renderTopicDetail();updateMenuCounts()})})}
$('btnAddSubtopic').addEventListener('click',()=>openSubtopicModal(currentTopicDetailId,null));
$('btnReviewSubtopic').addEventListener('click',()=>{const t=TOPICS.find(x=>x.id===currentTopicDetailId);if(!t)return;const keys=[];(t.subtopics||[]).forEach(st=>(st.cards||[]).forEach(c=>keys.push(cardKey(c.q,c.a))));if(keys.length===0){showAlert('این درس کارتی ندارد.','warn');return}startSession('custom',keys)});
$('btnExportTopic').addEventListener('click',()=>{const t=TOPICS.find(x=>x.id===currentTopicDetailId);if(!t)return;exportTopicJSON(t)});
$('btnCloseTopicDetail').addEventListener('click',()=>{$('topicPanel').classList.remove('show');showTopicsPanel()});
$('btnCloseTopics').addEventListener('click',goMenu);
$('btnTopicsMenu').addEventListener('click',showTopicsPanel);
$('btnSubjectSearch').addEventListener('click',()=>{$('mainMenu').style.display='none';$('topicsPanel').classList.remove('show');$('subjectSearchPanel').classList.add('show');renderSubjectSearch('');$('subjectSearchInput').focus()});
$('btnCloseSubjectSearch').addEventListener('click',goMenu);
$('subjectSearchInput').addEventListener('input',e=>{renderSubjectSearch(e.target.value.trim())});
function renderSubjectSearch(q){const wrap=$('subjectSearchResults');if(!q){wrap.innerHTML='<div style="text-align:center;padding:20px;color:var(--mt)">نام درس یا مبحث را بنویسید...</div>';return}const results=[];TOPICS.forEach(t=>{if(t.name.includes(q)){results.push({type:'topic',topic:t})}(t.subtopics||[]).forEach(st=>{if(st.name.includes(q)){results.push({type:'sub',topic:t,sub:st})}})});if(results.length===0){wrap.innerHTML='<div style="text-align:center;padding:20px;color:var(--mt)">نتیجه‌ای یافت نشد.</div>';return}wrap.innerHTML=results.map((r,i)=>{if(r.type==='topic'){const cc=(r.topic.subtopics||[]).reduce((s,st)=>s+(st.cards||[]).length,0);return`<div class="subtopic-item"><div class="sub-name">📚 <b>${escapeHtml(r.topic.name)}</b> <span class="card-count">${cc} کارت</span></div><div class="sub-actions"><button class="primary" data-goto-topic="${r.topic.id}">📋 نمایش</button></div></div>`}else{return`<div class="subtopic-item"><div class="sub-name">📂 ${escapeHtml(r.topic.name)} › <b>${escapeHtml(r.sub.name)}</b> <span class="card-count">${(r.sub.cards||[]).length} کارت</span></div><div class="sub-actions"><button class="primary" data-goto-sub="${r.topic.id}|${r.sub.id}">📋 نمایش</button></div></div>`}}).join('');wrap.querySelectorAll('[data-goto-topic]').forEach(b=>{b.addEventListener('click',()=>openTopicDetail(b.dataset.gotoTopic))});wrap.querySelectorAll('[data-goto-sub]').forEach(b=>{b.addEventListener('click',()=>{const[tid,sid]=b.dataset.gotoSub.split('|');openSubtopicDetail(tid,sid)})})}
function handleJSONUpload(text){let data;try{data=JSON.parse(text)}catch(e){showAlert('فایل JSON نامعتبر است.','err');return}let added=0,skipped=0,warned=0;const mergeCard=(topic,subName,q,a)=>{if(!q||!a)return;let st=(topic.subtopics||[]).find(x=>x.name===subName);if(!st){st={id:makeId(),name:subName||'بدون مبحث',cards:[]};if(!topic.subtopics)topic.subtopics=[];topic.subtopics.push(st)}if(!st.cards)st.cards=[];const k=cardKey(q,a);if(st.cards.some(c=>cardKey(c.q,c.a)===k)){skipped++;return}const similar=getAllCards().find(c=>c.q.trim()===q.trim()&&c.a.trim()!==a.trim());if(similar){if(confirm(`کارت مشابهی با سؤال یکسان و پاسخ متفاوت وجود دارد:\n\nسؤال: ${q}\nپاسخ جدید: ${a}\nپاسخ قبلی: ${similar.a}\n\nاضافه شود؟`)){st.cards.push({q,a});added++}else{warned++}return}st.cards.push({q,a});added++};const processTopic=(topicName,subtopics,flatCards)=>{let topic=TOPICS.find(x=>x.name===topicName);if(!topic){topic={id:makeId(),name:topicName||'بدون دسته',subtopics:[]};TOPICS.push(topic)}if(subtopics&&Array.isArray(subtopics)){subtopics.forEach(st=>{(st.cards||[]).forEach(c=>mergeCard(topic,st.name||'بدون مبحث',c.q,c.a))})}if(flatCards&&Array.isArray(flatCards)){flatCards.forEach(c=>mergeCard(topic,'بدون مبحث',c.q,c.a))}};if(Array.isArray(data)){processTopic('بدون دسته',null,data)}else if(data.topics&&Array.isArray(data.topics)){data.topics.forEach(t=>processTopic(t.name||'بدون دسته',t.subtopics,t.cards))}else if(data.topic||data.subtopics||data.cards){processTopic(data.topic||'بدون دسته',data.subtopics,data.cards)}else{showAlert('ساختار JSON شناسایی نشد.','err');return}saveTopics();updateMenuCounts();renderTopicsList();showAlert(`✅ ${added} کارت اضافه شد. ${skipped} تکراری رد شد. ${warned} مشابه رد شد.`,'ok')}
$('btnUploadTop').addEventListener('click',()=>$('fileInputCards').click());
$('btnUploadTopic').addEventListener('click',()=>$('fileInputCards').click());
$('btnUploadSettings').addEventListener('click',()=>$('fileInputCards').click());
$('fileInputCards').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>handleJSONUpload(ev.target.result);r.readAsText(f);e.target.value=''});
function exportTopicJSON(t){const data={version:1,topic:t.name,subtopics:(t.subtopics||[]).map(st=>({name:st.name,cards:st.cards||[]}))};downloadJSON(data,`درس-${t.name}.json`)}
function exportSubtopicJSON(t,st){const data={version:1,topic:t.name,subtopics:[{name:st.name,cards:st.cards||[]}]};downloadJSON(data,`مبحث-${st.name}.json`)}
function downloadJSON(data,filename){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.click();URL.revokeObjectURL(url);showAlert('📤 فایل خروجی ذخیره شد.','ok')}
$('btnEmptyTemplate').addEventListener('click',()=>{const data={version:1,topic:"نام درس",subtopics:[{name:"نام مبحث ۱",cards:[{q:"سؤال ۱",a:"پاسخ ۱"},{q:"سؤال ۲",a:"پاسخ ۲"}]},{name:"نام مبحث ۲",cards:[{q:"سؤال ۳",a:"پاسخ ۳"}]}]};downloadJSON(data,'قالب-خالی.json')});
$('btnExport').addEventListener('click',exportBackup);
$('btnQuickExport').addEventListener('click',exportBackup);
function exportBackup(){const data={version:5,exportedAt:new Date().toISOString(),settings:SETTINGS,state:STATE,topics:TOPICS};const d=new Date();const stamp=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'_'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0');downloadJSON(data,`پشتیبان-${stamp}.json`);try{localStorage.setItem(BACKUP_KEY,String(Date.now()))}catch(e){}updateBackupNotice()}
$('btnImport').addEventListener('click',()=>$('fileInput').click());
$('fileInput').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const data=JSON.parse(ev.target.result);if(!data.state||!data.topics){showAlert('فایل نامعتبر.','err');return}if(!confirm('همه داده‌های فعلی جایگزین می‌شوند. مطمئنید؟'))return;STATE=data.state;TOPICS=data.topics;if(data.settings){SETTINGS=data.settings;try{localStorage.setItem(SETTINGS_KEY,JSON.stringify(SETTINGS))}catch(e){}loadSettings()}saveState(true);saveTopics();updateMenuCounts();renderTopicsList();showAlert('✅ بازیابی شد.','ok')}catch(err){showAlert('خطا: '+err.message,'err')}};r.readAsText(f);e.target.value=''});
$('btnSettings').addEventListener('click',()=>$('settings').classList.toggle('show'));
$('btnSaveSettings').addEventListener('click',()=>{const p=parseInt($('setPartial').value)||2;const c=$('setCorrect').value.split(',').map(x=>parseInt(x.trim())).filter(x=>x>0);const w=parseInt($('setWrong').value)||1;const h=parseInt($('setHardThreshold').value)||3;if(c.length===0){alert('زنجیره درست خالی است');return}SETTINGS.partialDays=p;SETTINGS.correctSteps=c;SETTINGS.wrongDays=w;SETTINGS.hardThreshold=h;saveLS(SETTINGS_KEY,SETTINGS);showAlert('✅ تنظیمات ذخیره شد.','ok');updateMenuCounts()});
$('btnResetAll').addEventListener('click',()=>{if(!confirm('همه پیشرفت و درس‌ها پاک شود؟'))return;if(!confirm('مطمئنید؟ قابل بازگشت نیست.'))return;try{localStorage.removeItem(STORAGE_KEY);localStorage.removeItem(SETTINGS_KEY);localStorage.removeItem(TOPICS_KEY);sessionStorage.removeItem(STORAGE_KEY);sessionStorage.removeItem(TOPICS_KEY)}catch(e){}location.reload()});
$('btnShowStorageInfo').addEventListener('click',async()=>{let lsCount=0,tpCount=0;try{const raw=localStorage.getItem(STORAGE_KEY);if(raw)lsCount=raw.length;const rtp=localStorage.getItem(TOPICS_KEY);if(rtp)tpCount=rtp.length}catch(e){}const idbData=await loadIDB();let idbCount=0;if(idbData)idbCount=JSON.stringify(idbData).length;let backupAgo='هرگز';try{const last=localStorage.getItem(BACKUP_KEY);if(last){backupAgo=Math.round((Date.now()-parseInt(last))/86400000)+' روز پیش'}}catch(e){}alert('وضعیت ذخیره‌سازی:\n\nlocalStorage (پیشرفت): '+(lsCount>0?'✅ '+lsCount+' بایت':'❌ خالی')+'\nlocalStorage (درس‌ها): '+(tpCount>0?'✅ '+tpCount+' بایت':'❌ خالی')+'\nIndexedDB: '+(idbCount>0?'✅ '+idbCount+' بایت':'❌ خالی')+'\nآخرین پشتیبان: '+backupAgo+'\n\nتعداد درس‌ها: '+TOPICS.length+'\nتعداد کل کارت‌ها: '+getAllCards().length+'\nپیشرفت: '+overallProgress()+'%')});
function applyTheme(t){document.body.classList.toggle('light',t==='light')}
$('btnTheme').addEventListener('click',()=>{let cur='dark';try{cur=localStorage.getItem(THEME_KEY)||'dark'}catch(e){}const nxt=cur==='dark'?'light':'dark';try{localStorage.setItem(THEME_KEY,nxt)}catch(e){}applyTheme(nxt)});
try{applyTheme(localStorage.getItem(THEME_KEY)||'dark')}catch(e){applyTheme('dark')}
$('btnSearch').addEventListener('click',()=>{$('searchBox').classList.toggle('show');if($('searchBox').classList.contains('show'))$('searchInput').focus()});
$('searchInput').addEventListener('input',e=>{const q=e.target.value.trim();const res=$('searchResults');if(q.length<2){res.innerHTML='';return}const all=getAllCards();const matches=all.filter(c=>c.q.includes(q)||c.a.includes(q));res.innerHTML=matches.slice(0,30).map(c=>`<div data-key="${encodeURIComponent(c.key)}">${escapeHtml(c.q.slice(0,60))}${c.q.length>60?'…':''} <span style="color:var(--mt);font-size:.7rem">— ${escapeHtml(c.topicName)} › ${escapeHtml(c.subtopicName)}</span></div>`).join('');res.querySelectorAll('div').forEach(d=>{d.addEventListener('click',()=>{const key=decodeURIComponent(d.dataset.key);startSession('custom',[key]);$('searchBox').classList.remove('show');$('searchInput').value='';$('searchResults').innerHTML=''})})});
$('btnSaveNow').addEventListener('click',async()=>{await saveState(true);saveTopics();showSaveIndicator(saveStatus.ls,saveStatus.idb);const el=$('saveIndicator');el.textContent='💾 ذخیره دستی — '+new Date().toLocaleTimeString('fa-IR');el.className='save-indicator ok'});
window.addEventListener('beforeunload',()=>{try{if(STATE)saveLS(STORAGE_KEY,STATE);if(TOPICS)saveLS(TOPICS_KEY,TOPICS)}catch(e){}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){saveState(true);saveTopics()}});
function updateBackupNotice(){try{const last=localStorage.getItem(BACKUP_KEY);const n=$('backupNotice');if(!last){n.classList.add('show');return}const d=(Date.now()-parseInt(last))/86400000;if(d>3)n.classList.add('show');else n.classList.remove('show')}catch(e){}}
async function init(){try{await openIDB();saveStatus.idb=true}catch(e){saveStatus.idb=false}loadSettings();STATE=await loadState();TOPICS=loadTopics();getAllCards().forEach(c=>getCardState(c.key));await saveState(true);updateMenuCounts();updateBackupNotice();$('card').style.display='none';$('actions').style.display='none';document.querySelector('.nav-row').style.display='none';if(saveStatus.ls&&saveStatus.idb)showSaveIndicator(true,true);else if(saveStatus.ls||saveStatus.idb)showSaveIndicator(saveStatus.ls,saveStatus.idb);else{const el=$('saveIndicator');el.textContent='⚠️ ذخیره‌سازی در دسترس نیست! لطفاً خروجی بگیرید';el.className='save-indicator err'}}
init();
