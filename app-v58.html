<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>فلش‌کارت v58</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0f172a}
#v58Frame{display:block;width:100%;height:100%;border:0;background:#0f172a}
#v58Boot{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:#0f172a;color:#e2e8f0;font:700 15px Tahoma,Arial,sans-serif;
  z-index:999999
}
#v58Boot .box{
  padding:20px 24px;border:1px solid #334155;border-radius:14px;
  background:#1e293b;box-shadow:0 0 30px rgba(34,211,238,.12);
  text-align:center;line-height:2
}
</style>
</head>
<body>
<div id="v58Boot"><div class="box">در حال راه‌اندازی نسخهٔ ۵۸…</div></div>
<iframe id="v58Frame" title="Flashcard v58" allow="autoplay"></iframe>

<script>
(function(){
  'use strict';

  var frame=document.getElementById('v58Frame');
  var boot=document.getElementById('v58Boot');

  function hideBoot(){
    if(boot)boot.style.display='none';
  }

  function showBoot(msg){
    if(boot){
      boot.style.display='flex';
      boot.querySelector('.box').textContent=msg||'در حال راه‌اندازی…';
    }
  }

  /* ---------------------------------------------------------
     هستهٔ فعلی برنامه را اجرا کن تا تمام امکانات قبلی حفظ شوند.
     کاربر باید app-v56.html را فعلاً در همان پوشه نگه دارد.
     --------------------------------------------------------- */
  frame.src='./app-v56.html?v58base=1';

  frame.addEventListener('load',function(){
    try{
      patchApp(frame.contentWindow,frame.contentDocument);
      hideBoot();
    }catch(e){
      console.error('v58 patch error',e);
      showBoot('نسخهٔ ۵۸ نتوانست برنامهٔ پایه را آماده کند.');
    }
  });

  function patchApp(W,D){
    if(W.__V58_FINAL__)return;
    W.__V58_FINAL__=true;

    var DATA=W.DATA;
    var SESSION=W.SESSION;
    var $=W.$;

    if(!DATA||!SESSION){
      throw new Error('DATA/SESSION پیدا نشد');
    }

    /* ========================================================
       کمکی‌ها
       ======================================================== */
    function esc(s){
      if(W.esc)return W.esc(String(s==null?'':s));
      return String(s==null?'':s).replace(/[&<>"']/g,function(c){
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
      });
    }

    function toast(msg){
      try{
        if(W.toast) return W.toast(msg);
      }catch(e){}
      alert(msg);
    }

    function active(k){
      try{return W.isActive(k);}
      catch(e){return true;}
    }

    function due(k){
      try{return W.isDue(k);}
      catch(e){return false;}
    }

    function cardState(k){
      try{return W.getS(k);}
      catch(e){return DATA.cards[k]||(DATA.cards[k]={});}
    }

    function save(){
      try{return W.save();}
      catch(e){}
    }

    async function saveNow(){
      if(W.saveNow)return await W.saveNow();
      if(W.persist)return await W.persist();
      save();
      return true;
    }

    function refresh(){
      [
        'updateCounts',
        'renderWelcomeStats',
        'renderWelcomeDay',
        'renderRailRecords',
        'renderRailToday',
        'renderBatch',
        'renderDailyWidget'
      ].forEach(function(fn){
        try{if(typeof W[fn]==='function')W[fn]();}catch(e){}
      });
      try{
        if(D.getElementById('pTopics')?.classList.contains('show') &&
           typeof W.renderTopics==='function') W.renderTopics();
      }catch(e){}
      try{
        if(D.getElementById('pPlan')?.classList.contains('show') &&
           typeof W.renderPlanPanel==='function') W.renderPlanPanel();
      }catch(e){}
    }

    /* ========================================================
       ۱) ظاهر کارت: عمودی‌تر و متناسب‌تر، بدون فونت غول‌آسا
       ======================================================== */
    var style=D.createElement('style');
    style.id='v58-final-style';
    style.textContent=`
      :root{
        --v58-neon:#22d3ee;
        --v58-neon2:#a78bfa;
        --v58-good:#4ade80;
        --v58-mid:#fbbf24;
        --v58-bad:#f87171;
      }

      /* کارت */
      .card-area{
        width:100%!important;
        max-width:780px!important;
        min-height:560px!important;
        height:auto!important;
        margin:0 auto 10px!important;
        padding:34px 26px 42px!important;
        border-radius:20px!important;
        border-width:2px!important;
      }

      .card-area .c-head{
        min-height:78px!important;
        padding:48px 18px 18px!important;
        margin-bottom:12px!important;
      }

      .card-area .q{
        min-height:220px!important;
        padding:34px 26px!important;
        font-size:18px!important;
        line-height:2.05!important;
        font-weight:600!important;
        border-radius:14px!important;
        white-space:normal!important;
        overflow-wrap:anywhere!important;
      }

      .card-area .a{
        min-height:160px!important;
        padding:30px 26px 34px!important;
        margin-top:12px!important;
        font-size:18px!important;
        line-height:2.05!important;
        font-weight:600!important;
        border-radius:12px!important;
        overflow-wrap:anywhere!important;
      }

      /* تمرکز عمیق */
      body.focus-mode.in-session{
        padding-left:8px!important;
        padding-right:8px!important;
        overflow-y:auto!important;
        overflow-x:hidden!important;
        display:block!important;
        height:auto!important;
        min-height:100dvh!important;
      }

      body.focus-mode.in-session .page-wrap{
        display:block!important;
        width:100%!important;
        max-width:820px!important;
        margin:0 auto!important;
      }

      body.focus-mode.in-session .main-col{
        width:100%!important;
        min-width:0!important;
      }

      body.focus-mode.in-session .card-area.show,
      body.v58-quick-session .card-area.show{
        width:100%!important;
        max-width:760px!important;
        min-height:620px!important;
        height:auto!important;
        margin:0 auto 12px!important;
        padding:34px 28px 44px!important;
        border-radius:22px!important;
      }

      body.focus-mode.in-session .card-area .q,
      body.v58-quick-session .card-area .q{
        min-height:250px!important;
        padding:36px 30px!important;
        font-size:19px!important;
        line-height:2.1!important;
      }

      body.focus-mode.in-session .card-area .a,
      body.v58-quick-session .card-area .a{
        min-height:175px!important;
        padding:32px 30px 36px!important;
        font-size:18px!important;
        line-height:2.1!important;
      }

      /* پاسخ‌ها: درست چپ، حدودی وسط، غلط راست */
      #actions,.actions{
        direction:ltr!important;
        display:grid!important;
        grid-template-columns:repeat(3,minmax(0,1fr))!important;
        gap:8px!important;
        width:100%!important;
        max-width:760px!important;
        margin:8px auto 0!important;
      }

      #actions button,.actions button{
        direction:rtl!important;
        min-height:50px!important;
        border-radius:11px!important;
      }

      .v58-answer-good{order:1!important}
      .v58-answer-mid{order:2!important}
      .v58-answer-bad{order:3!important}

      /* نئون منوها و کلیدها */
      .menu-btn,.mid-item,.rail-item,.icon-btn,.btn,.mini,.drop-i,
      .nav button,.tool,kbd{
        transition:box-shadow .16s ease,border-color .16s ease,
                   text-shadow .16s ease,transform .12s ease!important;
      }

      .menu-btn:hover,.menu-btn:focus-visible,
      .mid-item:hover,.mid-item:focus-visible,
      .rail-item:hover,.rail-item:focus-visible,
      .icon-btn:hover,.icon-btn:focus-visible,
      .btn:hover,.btn:focus-visible,
      .mini:hover,.mini:focus-visible,
      .drop-i:hover,.drop-i:focus-visible,
      .nav button:hover,.nav button:focus-visible{
        border-color:var(--v58-neon)!important;
        box-shadow:0 0 7px rgba(34,211,238,.45),
                   0 0 19px rgba(34,211,238,.18)!important;
        text-shadow:0 0 7px rgba(34,211,238,.65)!important;
      }

      .menu-btn:active,.mid-item:active,.rail-item:active,
      .icon-btn:active,.btn:active,.mini:active,.drop-i:active,
      .nav button:active,.tool:active{
        transform:scale(.97)!important;
      }

      kbd{
        border-color:var(--v58-neon)!important;
        color:var(--v58-neon)!important;
        box-shadow:0 0 6px rgba(34,211,238,.32),
                   inset 0 0 6px rgba(34,211,238,.06)!important;
        text-shadow:0 0 6px rgba(34,211,238,.7)!important;
      }

      #btnSync{
        border-color:var(--v58-neon)!important;
        color:var(--v58-neon)!important;
        box-shadow:0 0 7px rgba(34,211,238,.38),
                   0 0 17px rgba(34,211,238,.12)!important;
      }

      .v58-neon-back{
        border-color:var(--v58-neon2)!important;
        color:var(--v58-neon2)!important;
        box-shadow:0 0 6px rgba(167,139,250,.35),
                   0 0 17px rgba(167,139,250,.12)!important;
      }

      .v58-last-sub{
        outline:2px solid var(--v58-neon)!important;
        outline-offset:3px!important;
        border-radius:8px!important;
        box-shadow:0 0 12px rgba(34,211,238,.28)!important;
      }

      /* Top 20 */
      .v58-top-card{
        position:relative;
        display:block;
        padding:12px 12px 10px 44px!important;
        margin-bottom:6px;
        background:var(--card2);
        border:1px solid var(--bd);
        border-radius:10px;
        cursor:pointer;
      }
      .v58-top-card:hover{
        border-color:var(--v58-neon)!important;
        box-shadow:0 0 8px rgba(34,211,238,.22)!important;
      }
      .v58-top-rank{
        position:absolute;left:9px;top:9px;
        width:27px;height:27px;
        display:flex;align-items:center;justify-content:center;
        border:1px solid var(--v58-neon);
        border-radius:8px;color:var(--v58-neon);
        font-weight:800;
        box-shadow:0 0 6px rgba(34,211,238,.22);
      }
      .v58-top-q{font-size:12px;line-height:1.9}
      .v58-top-meta{
        margin-top:6px;display:flex;
        justify-content:space-between;align-items:center;
        gap:8px;color:var(--muted);font-size:10px
      }

      /* دکمهٔ برگشت */
      #v58BackBtn{
        border-color:var(--v58-neon2)!important;
        color:var(--v58-neon2)!important;
      }

      @media(max-width:600px){
        .card-area{
          min-height:530px!important;
          padding:30px 14px 38px!important;
          border-radius:18px!important;
        }
        .card-area .c-head{
          min-height:72px!important;
          padding:42px 10px 16px!important;
        }
        .card-area .q{
          min-height:215px!important;
          padding:32px 14px!important;
          font-size:17px!important;
        }
        .card-area .a{
          min-height:150px!important;
          padding:28px 14px 32px!important;
          font-size:17px!important;
        }
        body.focus-mode.in-session .card-area.show,
        body.v58-quick-session .card-area.show{
          min-height:calc(100dvh - 135px)!important;
          padding:28px 12px 36px!important;
        }
        body.focus-mode.in-session .card-area .q,
        body.v58-quick-session .card-area .q{
          min-height:215px!important;
          padding:30px 12px!important;
          font-size:18px!important;
        }
        body.focus-mode.in-session .card-area .a,
        body.v58-quick-session .card-area .a{
          min-height:145px!important;
          padding:28px 12px 32px!important;
          font-size:17px!important;
        }
      }
    `;
    D.head.appendChild(style);

    /* ========================================================
       ۲) وضعیت مرور و زمان تغییر کارت
       ======================================================== */
    var stateEpoch=0;

    function touchKey(k){
      try{
        if(!k)return;
        var s=cardState(k);
        if(!s)return;
        s.updatedAt=Date.now();
        s.lastActionAt=s.updatedAt;
        stateEpoch++;
      }catch(e){}
    }

    function currentCard(){
      try{
        return SESSION&&SESSION.queue&&SESSION.queue[SESSION.idx]||null;
      }catch(e){return null}
    }

    if(typeof W.answerCard==='function'){
      var baseAnswer=W.answerCard;
      W.answerCard=function(type,fromQ4){
        var c=currentCard();
        var r=baseAnswer.apply(this,arguments);
        try{if(c)touchKey(c.key)}catch(e){}
        return r;
      };
    }

    /* بعد از ابزارهای کارت هم زمان تغییر ثبت شود */
    D.addEventListener('click',function(e){
      var b=e.target.closest &&
        e.target.closest(
          '#tStar,#tSusp,#tDel,#tPin,#tEdit,'+
          '#noteSave,#eSave,#mSave,#savV,'+
          '#sdRead,#sdDel'
        );
      if(!b)return;
      setTimeout(function(){
        var c=currentCard();
        if(c)touchKey(c.key);
      },0);
    },true);

    /* ========================================================
       ۳) فهرست کارت‌ها برای سرعت
       ======================================================== */
    var index={
      stamp:'',
      list:null,
      map:null
    };

    function makeStamp(){
      var ts=DATA.topics||[];
      var n=0,ss=0,cs=0;
      var id='';
      for(var i=0;i<ts.length;i++){
        var t=ts[i]||{};
        id+=String(t.id||i)+'|';
        var subs=t.subtopics||[];
        ss+=subs.length;
        for(var j=0;j<subs.length;j++){
          var s=subs[j]||{};
          cs+=(s.cards||[]).length;
          id+=String(s.id||j)+':'+((s.cards||[]).length)+'|';
        }
      }
      return ts.length+'|'+ss+'|'+cs+'|'+id;
    }

    function rebuildIndex(){
      var st=makeStamp();
      if(index.stamp===st && index.list && index.map)return;

      var list=[],map={};
      var ts=DATA.topics||[];

      for(var i=0;i<ts.length;i++){
        var t=ts[i]||{};
        var subs=t.subtopics||[];

        for(var j=0;j<subs.length;j++){
          var s=subs[j]||{};
          var cards=s.cards||[];

          for(var k=0;k<cards.length;k++){
            var c=cards[k]||{};
            var key=W.ck ? W.ck(c.q||'',c.a||'') :
              String(c.q||'')+'\\u0000'+String(c.a||'');

            var item={
              topicId:t.id,
              topicName:t.name,
              subId:s.id,
              subName:s.name,
              q:c.q||'',
              a:c.a||'',
              tags:c.tags||[],
              audioQKey:c.audioQKey||null,
              audioAKey:c.audioAKey||null,
              photoKey:c.photoKey||null,
              key:key
            };

            list.push(item);
            if(!map[key])map[key]=item;
          }
        }
      }

      index.stamp=st;
      index.list=list;
      index.map=map;
    }

    function invalidateIndex(){
      index.stamp='';
      index.list=null;
      index.map=null;
    }

    /* همهٔ کارت‌ها را memoize کن، ولی فقط وقتی ساختار عوض شده دوباره بساز */
    if(typeof W.getAllCards==='function'){
      W.getAllCards=function(){
        rebuildIndex();
        return index.list;
      };
    }

    if(typeof W.findCard==='function'){
      W.findCard=function(k){
        rebuildIndex();
        return index.map[k]||null;
      };
    }

    /* هر render ساختار را دست‌کم از نظر تعداد بررسی می‌کند */
    var baseRender=W.render;
    if(typeof baseRender==='function'){
      W.render=function(){
        var r=baseRender.apply(this,arguments);
        try{
          invalidateIndex();
          rebuildIndex();
        }catch(e){}
        syncSessionClass();
        fixAnswerButtons();
        return r;
      };
    }

    /* ========================================================
       ۴) مرور برنامه: فقط کارت واقعاً سررسیده
       ======================================================== */
    function dueKeysForTopic(tid,sid){
      var t=(DATA.topics||[]).find(function(x){return x.id===tid;});
      if(!t)return [];
      var list=[];
      var subs=t.subtopics||[];

      for(var i=0;i<subs.length;i++){
        var s=subs[i]||{};
        if(sid && s.id!==sid)continue;

        var cards=s.cards||[];
        for(var j=0;j<cards.length;j++){
          var c=cards[j]||{};
          var k=W.ck(c.q||'',c.a||'');
          if(active(k)&&due(k))list.push(k);
        }
      }
      return list;
    }

    W.getDueKeysForTopic=dueKeysForTopic;

    /* لایهٔ نهایی: هیچ startSession نوع due کارت زودرس نگیرد */
    if(typeof W.startSession==='function'){
      var baseStart=W.startSession;
      W.startSession=function(mode,keys,info,opts){
        if(mode==='due'){
          keys=(keys||[]).filter(function(k){
            return active(k)&&due(k);
          });
          if(!keys.length){
            toast('⏰ فعلاً کارت سررسیده‌ای نیست');
            return;
          }
        }
        var r=baseStart.apply(this,[mode,keys,info,opts]);
        syncSessionClass();
        fixAnswerButtons();
        return r;
      };
      W.startSession=W.startSession;
      W.window?.startSession;
    }

    /* دکمه‌های برنامه */
    D.addEventListener('click',function(e){
      var b=e.target.closest &&
        e.target.closest('#planBody [data-act="rev"][data-p]');
      if(!b)return;

      e.preventDefault();
      e.stopImmediatePropagation();

      var p=(DATA.plans||[]).find(function(x){return x.id===b.dataset.p;});
      if(!p)return;

      var ks=dueKeysForTopic(p.topicId);
      if(!ks.length){
        toast('⏰ فعلاً کارت سررسیده‌ای برای این برنامه نیست');
        return;
      }
      W.startSession('due',ks,{tid:p.topicId},{ordered:true});
    },true);

    /* مرور درس و زیرمبحث */
    if(typeof W.handleTopicAct==='function'){
      var baseTopicAct=W.handleTopicAct;
      W.handleTopicAct=function(a,tid,sid){
        if(a==='rev'){
          var ks=dueKeysForTopic(tid);
          if(!ks.length){
            toast('⏰ فعلاً کارت سررسیده‌ای نیست');
            return;
          }
          return W.startSession('due',ks,{tid:tid},{ordered:true});
        }
        if(a==='revsub'){
          var ks2=dueKeysForTopic(tid,sid);
          if(!ks2.length){
            toast('⏰ فعلاً کارت سررسیده‌ای نیست');
            return;
          }
          return W.startSession('due',ks2,{tid:tid,sid:sid},{ordered:true});
        }
        return baseTopicAct.apply(this,arguments);
      };
    }

    /* ========================================================
       ۵) آخرین مبحث تمام‌شده + کلید +
       ======================================================== */
    function rememberCompleted(tid,sid){
      if(!tid||!sid)return;
      DATA.lastReadSubtopic={
        tid:tid,
        sid:sid,
        at:Date.now()
      };
      save();
    }

    function findReadSubBefore(){
      try{
        var x=DATA.lastReadSubtopic;
        return x&&x.tid&&x.sid ? x.tid+'|'+x.sid : null;
      }catch(e){return null}
    }

    if(typeof W.setSubRead==='function'){
      var baseSetSubRead=W.setSubRead;
      W.setSubRead=function(tid,sid,v){
        var r=baseSetSubRead.apply(this,arguments);
        if(v)rememberCompleted(tid,sid);
        return r;
      };
    }

    if(typeof W.autoMarkSubRead==='function'){
      var baseAuto=W.autoMarkSubRead;
      W.autoMarkSubRead=function(){
        var before={};
        Object.keys(DATA.readSubtopics||{}).forEach(function(k){
          before[k]=!!DATA.readSubtopics[k];
        });

        var r=baseAuto.apply(this,arguments);

        Object.keys(DATA.readSubtopics||{}).forEach(function(k){
          if(DATA.readSubtopics[k]&&!before[k]){
            var p=k.split('|');
            if(p.length>=2)rememberCompleted(p[0],p[1]);
          }
        });

        return r;
      };
    }

    function scrollLastSub(smooth){
      var x=DATA.lastReadSubtopic;
      if(!x||!x.tid||!x.sid){
        toast('هنوز مبحث تمام‌شده‌ای ثبت نشده');
        return;
      }

      try{
        if(DATA.folders)DATA.folders.manage=true;
      }catch(e){}

      try{
        if(W.CURRENT_TAB)W.CURRENT_TAB[x.tid]=true;
      }catch(e){}

      try{
        if(typeof W.showTopicsPanel==='function')W.showTopicsPanel();
      }catch(e){}

      setTimeout(function(){
        var sel='#topicsList input[data-a="rd"][data-t="'+
          CSS.escape(String(x.tid))+
          '"][data-s="'+
          CSS.escape(String(x.sid))+
          '"]';

        var cb=D.querySelector(sel);
        if(!cb){
          var all=D.querySelectorAll('#topicsList input[data-a="rd"]');
          for(var i=0;i<all.length;i++){
            if(all[i].dataset.t===String(x.tid)&&
               all[i].dataset.s===String(x.sid)){
              cb=all[i];break;
            }
          }
        }

        if(!cb){
          toast('مبحث آخر پیدا نشد');
          return;
        }

        var row=cb.closest('.sub-row')||cb.parentElement;
        if(!row)return;

        D.querySelectorAll('.v58-last-sub').forEach(function(z){
          z.classList.remove('v58-last-sub');
        });
        row.classList.add('v58-last-sub');

        var top=D.querySelector('.topbar');
        var y=row.getBoundingClientRect().top+
          W.scrollY-
          ((top?top.offsetHeight:60)+12);

        W.scrollTo({
          top:Math.max(0,y),
          behavior:smooth===false?'auto':'smooth'
        });

        setTimeout(function(){

    /* ========================================================
       ۷) دکمهٔ ابر: هیچ ناوبری به تنظیمات نداشته باشد

    var cloud=D.getElementById('btnSync');

    async function doSync(showMsg){
      if(!W.syRec || !W.syncOnce){
        toast('☁️ بخش همگام‌سازی در دسترس نیست');
        return;
      }

      else if(r.s==='busy')toast('☁️ همگام‌سازی در حال انجام است');

    /* ========================================================
       ۸) همگام‌سازی امن و دوطرفه
       ======================================================== */
    if(W.syncOnce && W.syRec && W.syPack && W.syUnpack &&
       W.syFind && W.syCreate && W.GAPI && W.GFN){

      var GAPI=W.GAPI;
      var GFN=W.GFN;

      function isDataEmpty(d){
        return !(
          (d.topics&&d.topics.length) ||
          (d.cards&&Object.keys(d.cards).length) ||
          (d.xp&&Number(d.xp.xp)>0)
        );
      }

      function mergeCard(l,r){
        if(!l)return r;
        if(!r)return l;

        var lu=Number(l.updatedAt||l.lastActionAt||0);
        var ru=Number(r.updatedAt||r.lastActionAt||0);

        var base=Object.assign({},lu>=ru?l:r);

        [
          'correctCount','partialCount','wrongCount',
          'totalWrong','viewCount','timeSpent'
        ].forEach(function(k){
          base[k]=Math.max(Number(l[k]||0),Number(r[k]||0));
        });

        base.seen=!!(l.seen||r.seen);

        if(ru>lu){
          Object.keys(r).forEach(function(k){
            if(![
              'correctCount','partialCount','wrongCount',
              'totalWrong','viewCount','timeSpent','seen'
            ].includes(k)) base[k]=r[k];
          });
        }else if(lu>ru){
          Object.keys(l).forEach(function(k){
            if(![
              'correctCount','partialCount','wrongCount',
              'totalWrong','viewCount','timeSpent','seen'
            ].includes(k)) base[k]=l[k];
          });
        }else{
          [
            'starred','suspended','deleted','pinned','reverse'
          ].forEach(function(k){
            if(l[k]===true||r[k]===true)base[k]=true;
          });
        }
        return base;
      }

      function mergeTopics(remoteTopics){
        var local=DATA.topics||[];
        var map={};

        local.forEach(function(t){
          if(t&&t.id)map[t.id]=t;
        });

        (remoteTopics||[]).forEach(function(rt){
          if(!rt||!rt.id)return;

          if(!map[rt.id]){
            local.push(rt);
            map[rt.id]=rt;
            return;
          }

          var lt=map[rt.id];
          if(!lt.name&&rt.name)lt.name=rt.name;
          lt.subtopics=lt.subtopics||[];

          var sm={};
          lt.subtopics.forEach(function(s){
            if(s&&s.id)sm[s.id]=s;
          });

          (rt.subtopics||[]).forEach(function(rs){
            if(!rs||!rs.id)return;

            if(!sm[rs.id]){
              lt.subtopics.push(rs);
              sm[rs.id]=rs;
              return;
            }

            var ls=sm[rs.id];
            if(!ls.name&&rs.name)ls.name=rs.name;
            ls.cards=ls.cards||[];

            var cm={};
            ls.cards.forEach(function(c){
              if(c)cm[W.ck(c.q||'',c.a||'')]=c;
            });

            (rs.cards||[]).forEach(function(rc){
              if(!rc)return;
              var k=W.ck(rc.q||'',rc.a||'');
              if(!cm[k]){
                ls.cards.push(rc);
                cm[k]=rc;
              }
            });
          });
        });

        DATA.topics=local;
      }

      function mergeOther(remote){
        DATA.cards=DATA.cards||{};
        Object.keys(remote.cards||{}).forEach(function(k){
          DATA.cards[k]=mergeCard(DATA.cards[k],remote.cards[k]);
        });

        DATA.readSubtopics=Object.assign(
          {},DATA.readSubtopics||{},remote.readSubtopics||{}
        );

        DATA.medals=Object.assign({},DATA.medals||{},remote.medals||{});
        DATA.hidden=Object.assign({},DATA.hidden||{},remote.hidden||{});
        DATA.unlockables=Object.assign({},DATA.unlockables||{},remote.unlockables||{});
        DATA.unlockActive=Object.assign({},DATA.unlockActive||{},remote.unlockActive||{});

        mergeTopics(remote.topics||[]);

        /* شمارنده‌های روزانه: هیچ عدد خوانده‌شده‌ای عقب نرود */
        DATA.dailyRecords=DATA.dailyRecords||{};
        Object.keys(remote.dailyRecords||{}).forEach(function(d){
          var a=DATA.dailyRecords[d]||{};
          var b=remote.dailyRecords[d]||{};
          ['total','newCards','correct','wrong','partial'].forEach(function(k){
            a[k]=Math.max(Number(a[k]||0),Number(b[k]||0));
          });
          DATA.dailyRecords[d]=a;
        });

        DATA.xp=DATA.xp||{xp:0,level:1,history:[],boostUntil:null};
        if(remote.xp){
          DATA.xp.xp=Math.max(
            Number(DATA.xp.xp||0),
            Number(remote.xp.xp||0)
          );
          DATA.xp.level=Math.max(
            Number(DATA.xp.level||1),
            Number(remote.xp.level||1)
          );
          DATA.xp.history=(DATA.xp.history||[]).concat(remote.xp.history||[]);
          if(DATA.xp.history.length>1000)
            DATA.xp.history=DATA.xp.history.slice(-1000);
        }

        if(remote.plans){
          DATA.plans=DATA.plans||[];
          var pm={};
          DATA.plans.forEach(function(p){if(p&&p.id)pm[p.id]=p;});
          remote.plans.forEach(function(p){
            if(p&&p.id&&!pm[p.id]){
              DATA.plans.push(p);
              pm[p.id]=p;
            }
          });
        }

        if(remote.daily){
          DATA.daily=DATA.daily||{date:null,keys:[],done:false};
          DATA.daily.keys=Array.from(new Set(
            (DATA.daily.keys||[]).concat(remote.daily.keys||[])
          ));
          DATA.daily.done=!!(DATA.daily.done||remote.daily.done);
          if(remote.daily.date &&
             (!DATA.daily.date||remote.daily.date>DATA.daily.date)){
            DATA.daily.date=remote.daily.date;
          }
        }

        if(remote.batch){
          DATA.batch=DATA.batch||{keys:[],ts:0};
          DATA.batch.keys=Array.from(new Set(
            (DATA.batch.keys||[]).concat(remote.batch.keys||[])
          ));
          DATA.batch.ts=Math.max(
            Number(DATA.batch.ts||0),
            Number(remote.batch.ts||0)
          );
        }

        if(remote.journal){
          DATA.journal=Object.assign({},remote.journal,DATA.journal||{});
        }

        [
          'missions','challenge','folders','freeze','exam','recAnn'
        ].forEach(function(k){
          if(remote[k]!=null && DATA[k]==null) DATA[k]=remote[k];
        });

        try{W.migrateKeys();}catch(e){}
        invalidateIndex();
      }

      async function readRemote(rec,H){
        var headers=Object.assign({},H);
        if(rec.etag)headers['If-None-Match']=rec.etag;

        var r=await fetch(
          GAPI+'/gists/'+rec.gist,
          {headers:headers,cache:'no-store'}
        );

        if(r.status===304)return {notModified:true,etag:rec.etag};
        if(r.status===401||r.status===403)
          throw new Error('توکن GitHub معتبر نیست یا دسترسی لازم را ندارد');
        if(r.status===404)
          throw new Error('Gist پیدا نشد');
        if(!r.ok)
          throw new Error('خطای ابر ('+r.status+')');

        var j=await r.json();
        rec.etag=r.headers.get('ETag')||rec.etag||null;

        var f=j.files&&j.files[GFN];
        if(!f)return {empty:true,etag:rec.etag};

        var txt=f.truncated && f.raw_url
          ?await (await fetch(f.raw_url,{cache:'no-store'})).text()
          :f.content;

        var env=JSON.parse(txt);
        var unpack=await W.syUnpack(env);
        var data=JSON.parse(unpack);

        return {
          empty:false,
          env:env,
          data:data,
          savedAt:Number(env.savedAt||0),
          etag:rec.etag
        };
      }

      async function pushRemote(rec,H){
        DATA.v=58;
        DATA.savedAt=Date.now();

        var B=W.buildStr();
        var env=await W.syPack(W.bodyStr(B));
        env.savedAt=DATA.savedAt;

        var body={files:{}};
        body.files[GFN]={
          content:JSON.stringify(env)
        };

        var r=await fetch(
          GAPI+'/gists/'+rec.gist,
          {
            method:'PATCH',
            headers:Object.assign(
              {'Content-Type':'application/json'},
              H
            ),
            body:JSON.stringify(body),
            cache:'no-store'
          }
        );

        if(!r.ok)
          throw new Error('ارسال همگام‌سازی ناموفق بود ('+r.status+')');

        rec.etag=r.headers.get('ETag')||rec.etag||null;
        rec.sig=B.sig;
        rec.at=env.savedAt;
        W.sySave(rec);
      }

      var originalSyncState= W.syncOnce;
      W.syncOnce=async function(o){
        o=o||{};
        var rec=W.syRec();

        if(!rec.token)return {s:'off'};
        if(W.SY && W.SY.busy)return {s:'busy'};

        if(W.SY)W.SY.busy=true;
        try{
          var H={
            Authorization:'Bearer '+rec.token,
            Accept:'application/vnd.github+json'
          };

          if(!rec.gist){
            rec.gist=(await W.syFind(H))||(await W.syCreate(H));
            rec.etag=null;
            W.sySave(rec);
          }

          var remote=await readRemote(rec,H);

          var localEmpty=isDataEmpty(DATA);
          var localSig;
          try{localSig=W.buildStr().sig;}catch(e){localSig='';}
          var localChanged=!localEmpty &&
            (!rec.sig || localSig!==rec.sig);

          /* ابر خالی */
          if(remote.empty){
            if(!localEmpty){
              await pushRemote(rec,H);
              refresh();
              return {s:'pushed'};
            }
            rec.lastOk=new Date().toISOString();
            W.sySave(rec);
            return {s:'ok'};
          }

          /* 304: ابر دقیقاً همان چیزی است که آخرین بار دیده شده */
          if(remote.notModified){
            if(localChanged){
              await pushRemote(rec,H);
              refresh();
              return {s:'pushed'};
            }
            rec.lastOk=new Date().toISOString();
            W.sySave(rec);
            return {s:'ok'};
          }

          /* گوشی/دستگاه خالی: بدون پرسش، ابر را بگیرد */
          if(localEmpty){
            W.v58ApplyRemote
              ?W.v58ApplyRemote(remote.data)
              :(function(){
                Object.keys(remote.data||{}).forEach(function(k){
                  DATA[k]=remote.data[k];
                });
              })();

            DATA.savedAt=remote.savedAt||Date.now();
            DATA.v=58;
            await saveNow();

            rec.sig=W.buildStr().sig;
            rec.at=remote.savedAt;
            rec.lastOk=new Date().toISOString();
            W.sySave(rec);
            refresh();
            return {s:'pulled'};
          }

          /* اگر دستگاه محلی تغییر نکرده، ابر را بگیر */
          var remoteChanged=remote.savedAt!==Number(rec.at||0);

          if(!localChanged && remoteChanged){
            Object.keys(remote.data||{}).forEach(function(k){
              if(k==='cards')return;
              if(remote.data[k]!=null)DATA[k]=remote.data[k];
            });

            mergeTopics(remote.data.topics||[]);

            Object.keys(remote.data.cards||{}).forEach(function(k){
              DATA.cards[k]=remote.data.cards[k];
            });

            DATA.savedAt=remote.savedAt||Date.now();
            DATA.v=58;
            await saveNow();

            rec.sig=W.buildStr().sig;
            rec.at=remote.savedAt;
            rec.lastOk=new Date().toISOString();
            W.sySave(rec);
            invalidateIndex();
            refresh();
            return {s:'pulled'};
          }

          /* فقط محلی تغییر کرده */
          if(localChanged && !remoteChanged){
            await pushRemote(rec,H);
            refresh();
            return {s:'pushed'};
          }

          /* هر دو تغییر کرده: merge */
          if(localChanged && remoteChanged){
            mergeOther(remote.data);

            DATA.savedAt=Math.max(
              Date.now(),
              Number(DATA.savedAt||0),
              Number(remote.savedAt||0)
            );
            DATA.v=58;

            await saveNow();
            await pushRemote(rec,H);

            rec.sig=W.buildStr().sig;
            rec.at=DATA.savedAt;
            rec.lastOk=new Date().toISOString();
            W.sySave(rec);
            refresh();

            return {s:'merged'};
          }

          rec.lastOk=new Date().toISOString();
          rec.at=remote.savedAt;
          rec.sig=W.buildStr().sig;
          W.sySave(rec);
          return {s:'ok'};

        }catch(err){
          try{if(W.syUI)W.syUI('⚠️','❌ '+(err.message||err));}catch(e){}
          return {s:'err',m:String(err.message||err)};
        }finally{
          if(W.SY)W.SY.busy=false;
        }
      };
    }

    /* ========================================================
       ۹) پشتیبان: واقعاً داده را وارد و ذخیره کن، بدون reload
       ======================================================== */
    function backupLooksValid(x){
      /*
       * فقط فایل پشتیبان کامل را تشخیص بده.
       * فایل‌های عادیِ درس/زیرمبحث ممکن است topics داشته باشند،
       * اما معمولاً cards + وضعیت مطالعه/XP ندارند.
       */
      if(!x || typeof x!=='object')return false;

      var hasCards=
        !!(x.cards && typeof x.cards==='object');

      var hasState=
        !!(
          x.xp ||
          x.dailyRecords ||
          x.readSubtopics ||
          x.settings ||
          x.medals ||
          x.plans ||
          x.journal ||
          x.savedAt
        );

      return !!(hasCards && hasState);
    }

    function normalizeBackup(raw){
      var x=raw&&raw.data!=null?raw.data:raw;
      if(typeof x==='string'){
        try{x=JSON.parse(x);}catch(e){}
      }
      if(x&&x.state &&
         !x.topics &&
         !x.cards){
        x=x.state;
      }
      if(x&&x.data &&
         typeof x.data==='object' &&
         !x.topics &&
         !x.cards){
        x=x.data;
      }
      return x||{};
    }

    async function importBackupV58(file){
      var text=await new Promise(function(resolve,reject){
        var r=new FileReader();
        r.onload=function(){resolve(r.result);};
        r.onerror=function(){reject(new Error('فایل خوانده نشد'));};
        r.readAsText(file);
      });

      var raw;
      try{raw=JSON.parse(text);}
      catch(e){throw new Error('فایل پشتیبان JSON معتبر نیست');}

      var x=normalizeBackup(raw);

      if(!backupLooksValid(x)){
        return false; /* فایل درس/متن عادی است؛ به handler قدیمی بده */
      }

      var topicN=Array.isArray(x.topics)?x.topics.length:0;
      var cardN=x.cards?Object.keys(x.cards).length:0;

      if(!confirm(
        '📦 پشتیبان شناسایی شد\\n\\n'+
        '📚 درس‌ها: '+topicN+'\\n'+
        '🎴 وضعیت کارت‌ها: '+cardN+'\\n'+
        '⭐ XP: '+((x.xp&&x.xp.xp)||0)+
        '\\n\\nاطلاعات فعلی با این پشتیبان جایگزین می‌شود.'
      )){
        return true;
      }

      /* نسخهٔ قبل برای امنیت */
      try{
        var before=JSON.stringify(DATA,function(k,v){
          return k.charAt(0)==='_'?undefined:v;
        });
        if(W.idbPutKey)await W.idbPutKey('bak_before_import_v58',before);
      }catch(e){}

      [
        'cards','readSubtopics','dailyRecords','topics','settings','xp',
        'medals','hidden','missions','plans','journal','daily',
        'unlockables','unlockActive','simplify','batch','challenge',
        'folders','freeze','exam','recAnn','lastReadSubtopic'
      ].forEach(function(k){
        if(x[k]!=null)DATA[k]=x[k];
      });

      DATA.cards=DATA.cards||{};
      DATA.readSubtopics=DATA.readSubtopics||{};
      DATA.dailyRecords=DATA.dailyRecords||{};
      DATA.topics=DATA.topics||[];
      DATA.settings=Object.assign({},W.DEF||{},DATA.settings||{});
      DATA.xp=DATA.xp||{xp:0,level:1,history:[],boostUntil:null};
      DATA.v=58;
      DATA.savedAt=Date.now();

      try{W.migrateKeys();}catch(e){}
      invalidateIndex();

      var ok=await saveNow();
      if(!ok)throw new Error('ذخیرهٔ پشتیبان انجام نشد');

      /* تأیید */
      var verified=false;
      try{
        if(W.idbGetState){
          var s=await W.idbGetState();
          if(s){
            var o=JSON.parse(s);
            verified=!!(
              (o.topics&&o.topics.length) ||
              (o.cards&&Object.keys(o.cards).length)
            );
          }
        }
      }catch(e){}

      if(!verified){
        try{
          var ls=localStorage.getItem(W.LS_KEY);
          if(ls){
            var lo=JSON.parse(ls);
            verified=!!(
              (lo.topics&&lo.topics.length) ||
              (lo.cards&&Object.keys(lo.cards).length)
            );
          }
        }catch(e){}
      }

      if(!verified)throw new Error('ذخیره تأیید نشد');

      try{refresh();}catch(e){}
      toast(
        '✅ پشتیبان بازیابی شد · '+
        topicN+' درس · '+
        cardN+' وضعیت کارت'
      );

      /* بعد از وارد کردن همگام‌سازی اختیاری، بدون تغییر صفحه */
      setTimeout(function(){
        try{
          if(W.syRec&&W.syRec().token)W.syncOnce({force:true});
        }catch(e){}
      },700);

      return true;
    }

    W.importBackupV58=importBackupV58;

    function hookBackupInputs(){
      D.querySelectorAll('input[type="file"]').forEach(function(inp){
        if(inp.__v58BackupHook)return;
        inp.__v58BackupHook=true;

        inp.addEventListener('change',async function(e){
          var file=this.files&&this.files[0];
          if(!file)return;

          try{
            var text=await new Promise(function(resolve,reject){
              var r=new FileReader();
              r.onload=function(){resolve(r.result);};
              r.onerror=function(){reject(new Error('read'));};
              r.readAsText(file);
            });

            var raw;
            try{raw=JSON.parse(text);}catch(err){return;}

            var norm=normalizeBackup(raw);

            if(backupLooksValid(norm)){
              e.stopImmediatePropagation();
              e.preventDefault();
              await importBackupV58(file);
              this.value='';
            }
          }catch(err){
            console.error(err);
          }
        },true);
      });
    }

    hookBackupInputs();

    /* ========================================================
       ۱۰) بیشترین غلط / بیشترین بازدید: دقیقاً ۲۰ مورد، بدون اسم درس
       ======================================================== */
    function makeTop(kind){
      var bodyId=kind==='wrong'?'mostWrongsBody':'mostViewsBody';
      var panelId=kind==='wrong'?'pMostWrongs':'pMostViews';
      var body=D.getElementById(bodyId);
      if(!body)return;

      if(typeof W.getMostWrong!=='function' ||
         typeof W.getMostViews!=='function')return;

      var list=(kind==='wrong'
        ?W.getMostWrong(1000)
        :W.getMostViews(1000))||[];

      list=list.slice(0,20);

      if(!list.length){
        try{W.showPanel(panelId);}catch(e){}
        body.innerHTML=
          '<div class="empty">'+
          (kind==='wrong'?'هنوز کارتی غلط نخورده':'هنوز کارتی بازدید نشده')+
          '</div>';
        return;
      }

      try{W.showPanel(panelId);}catch(e){}

      var unit=kind==='wrong'?'غلط':'بازدید';

      var html=
        '<div class="srow" style="margin-bottom:10px">'+
          '<span>'+
          (kind==='wrong'
            ?'❌ ۲۰ کارت با بیشترین غلط'
            :'👁 ۲۰ کارت با بیشترین بازدید')+
          '</span>'+
          '<span style="font-size:10px;color:var(--muted)">فقط ۲۰ مورد برتر</span>'+
        '</div>';

      list.forEach(function(c,i){
        var s=DATA.cards[c.key]||{};
        var n=kind==='wrong'?(s.totalWrong||0):(s.viewCount||0);
        var q=(c.q||'').trim();
        if(q.length>120)q=q.slice(0,120)+'…';

        html+=
          '<div class="v58-top-card" data-k="'+esc(c.key)+'">'+
            '<div class="v58-top-rank">#'+(i+1)+'</div>'+
            '<div class="v58-top-q">'+esc(q||'[بدون سؤال]')+'</div>'+
            '<div class="v58-top-meta">'+
              '<span>'+unit+' '+n+'</span>'+
              '<span style="display:flex;gap:4px">'+
                '<button class="mini" data-v58-review="'+esc(c.key)+'">▶ مرور</button>'+
                '<button class="mini" data-v58-quick="'+esc(c.key)+'">⚡ سریع</button>'+
              '</span>'+
            '</div>'+
          '</div>';
      });

      body.innerHTML=html;

      body.querySelectorAll('[data-v58-review]').forEach(function(b){
        b.onclick=function(e){
          e.stopPropagation();
          W.startSession('all',[b.dataset.v58Review]);
        };
      });

      body.querySelectorAll('[data-v58-quick]').forEach(function(b){
        b.onclick=function(e){
          e.stopPropagation();
          if(W.startQuick)W.startQuick([b.dataset.v58Quick],null);
        };
      });

      body.querySelectorAll('.v58-top-card[data-k]').forEach(function(card){
        card.onclick=function(e){
          if(e.target.closest('button'))return;
          W.startSession('all',[card.dataset.k]);
        };
      });
    }

    W.showMostWrongs=function(){makeTop('wrong');};
    W.showMostViews=function(){makeTop('views');};

    /* ========================================================
       ۱۱) شمارش روزانهٔ امتحان: پیش‌فرض ۴ ماه + قابل تنظیم
       ======================================================== */
    function ensureExam(){
      DATA.exam=DATA.exam||{date:'2027-10-13'};
      if(!DATA.exam.calcMonths)DATA.exam.calcMonths=4;
      if(DATA.exam.showDaily===undefined)DATA.exam.showDaily=true;
    }

    ensureExam();

    function unreadCards(){
      rebuildIndex();
      var n=0;
      for(var i=0;i<index.list.length;i++){
        var k=index.list[i].key;
        if(active(k)){
          var s=cardState(k);
          if(!s.seen)n++;
        }
      }
      return n;
    }

    function examPlan(){
      ensureExam();
      var months=Math.max(1,Number(DATA.exam.calcMonths)||4);
      var days=Math.max(1,Math.round(months*30));
      var left=unreadCards();
      return {
        months:months,
        days:days,
        left:left,
        perDay:left?Math.ceil(left/days):0
      };
    }

    function renderExamPlan(){
      ensureExam();
      var b=D.getElementById('examBox');
      if(!b)return;

      var ex=DATA.exam.date;
      if(!ex){
        b.style.display='none';
        return;
      }

      var ms=new Date(ex+'T00:00:00').getTime()-Date.now();

      if(ms<=0){
        b.innerHTML='🎓 روز امتحان رسید';
        b.style.display='';
        return;
      }

      var days=Math.floor(ms/86400000);
      var hours=Math.floor((ms%86400000)/3600000);
      var p=examPlan();

      var h='⏳ تا امتحان: <b>'+days+'</b> روز و <b>'+hours+'</b> ساعت';

      if(DATA.exam.showDaily){
        h+='<br>📚 '+p.left+
          ' کارت نخوانده · با محاسبهٔ '+
          p.months+
          ' ماهه: <b>روزی '+
          p.perDay+
          ' کارت</b>';
      }

      b.innerHTML=h;
      b.style.display='';
    }

    function addExamSettings(){
      ensureExam();
      if(D.getElementById('v58ExamSettings'))return;

      var sections=D.querySelectorAll('#pSettings .sect');
      var anchor=sections[sections.length-1]||null;

      var sec=D.createElement('div');
      sec.className='sect';
      sec.id='v58ExamSettings';
      sec.innerHTML=
        '<h4>📚 محاسبهٔ مطالعه تا امتحان</h4>'+
        '<label style="display:block;margin-bottom:7px">'+
          '<input type="checkbox" id="v58ShowDailyExam"> '+
          'نمایش تعداد کارت پیشنهادی روزانه'+
        '</label>'+
        '<label style="display:block">'+
          'مدت محاسبه: '+
          '<input type="number" id="v58ExamMonths" min="1" max="24" step="1" '+
          'style="width:75px;background:var(--bg);border:1px solid var(--bd);color:var(--text);border-radius:6px;padding:5px">'+
          ' ماه'+
        '</label>'+
        '<div style="font-size:10px;color:var(--muted);margin-top:5px">'+
          'پیش‌فرض: ۴ ماه'+
        '</div>';

      if(anchor&&anchor.parentNode)
        anchor.parentNode.insertBefore(sec,anchor);
      else
        D.getElementById('pSettings')?.appendChild(sec);

      var show=D.getElementById('v58ShowDailyExam');
      var months=D.getElementById('v58ExamMonths');

      if(show){
        show.checked=DATA.exam.showDaily!==false;
        show.onchange=function(){
          DATA.exam.showDaily=this.checked;
          save();
          renderExamPlan();
        };
      }

      if(months){
        months.value=Number(DATA.exam.calcMonths)||4;
        months.onchange=function(){
          var v=parseInt(this.value,10)||4;
          v=Math.max(1,Math.min(24,v));
          DATA.exam.calcMonths=v;
          save();
          renderExamPlan();
        };
      }
    }

    if(typeof W.fillSettings==='function'){
      var baseFill=W.fillSettings;
      W.fillSettings=function(){
        var r=baseFill.apply(this,arguments);
        setTimeout(function(){
          addExamSettings();
          var a=D.getElementById('v58ShowDailyExam');
          var b=D.getElementById('v58ExamMonths');
          if(a)a.checked=DATA.exam.showDaily!==false;
          if(b)b.value=Number(DATA.exam.calcMonths)||4;
        },0);
        return r;
      };
    }

    addExamSettings();
    renderExamPlan();
    setInterval(renderExamPlan,60000);

    /* ========================================================
       ۱۲) دکمهٔ برگشت واقعی
       ======================================================== */
    var nav={
      stack:[],
      restoring:false
    };

    function panelId(){
      var p=D.querySelector('.panel.show');
      return p?p.id:null;
    }

    function snapshot(){
      var ct={};
      try{
        Object.keys(W.CURRENT_TAB||{}).forEach(function(k){
          ct[k]=W.CURRENT_TAB[k];
        });
      }catch(e){}

      var folders={};
      try{
        Object.keys(DATA.folders||{}).forEach(function(k){
          folders[k]=DATA.folders[k];
        });
      }catch(e){}

      return {
        panel:panelId(),
        scrollY:Number(W.scrollY)||0,
        currentTab:ct,
        activeDD:W.ACTIVE_DD||null,
        folders:folders
      };
    }

    function restore(s){
      if(!s)return;
      nav.restoring=true;

      try{
        Object.keys(W.CURRENT_TAB||{}).forEach(function(k){
          delete W.CURRENT_TAB[k];
        });
        Object.keys(s.currentTab||{}).forEach(function(k){
          W.CURRENT_TAB[k]=s.currentTab[k];
        });
      }catch(e){}

      try{W.ACTIVE_DD=s.activeDD||null;}catch(e){}

      try{
        DATA.folders=Object.assign({},s.folders||{});
        if(W.applyFolders)W.applyFolders();
      }catch(e){}

      try{
        if(s.panel&&W.showPanel)W.showPanel(s.panel);
        else if(W.goHome)W.goHome();
      }catch(e){}

      setTimeout(function(){
        try{W.scrollTo({top:s.scrollY,behavior:'auto'});}catch(e){}
        nav.restoring=false;
      },120);
    }

    if(typeof W.showPanel==='function'){
      var baseShowPanel=W.showPanel;
      W.showPanel=function(id){
        if(!nav.restoring){
          nav.stack.push(snapshot());
          if(nav.stack.length>25)nav.stack.shift();
        }
        return baseShowPanel.apply(this,arguments);
      };
      W.showPanel=W.showPanel;
    }

    function back(){
      if(D.querySelector('.modal-bg.show')){
        try{W.closeModal();return;}catch(e){}
      }
      if(nav.stack.length){
        restore(nav.stack.pop());
      }else{
        try{W.goHome();}catch(e){}
      }
    }

    if(!D.getElementById('v58BackBtn')){
      var settingsBtn=D.getElementById('btnSettings');
      if(settingsBtn&&settingsBtn.parentNode){
        var b=D.createElement('button');
        b.id='v58BackBtn';
        b.className='icon-btn v58-neon-back';
        b.title='برگشت به صفحهٔ قبلی';
        b.textContent='↩️';
        b.onclick=back;
        settingsBtn.parentNode.insertBefore(b,settingsBtn);
      }
    }

    W.v58Back=back;

    /* ========================================================
       ۱۳) کلاس تشخیص مرور سریع
       ======================================================== */
    function syncSessionClass(){
      try{
        D.body.classList.toggle(
          'v58-quick-session',
          !!(SESSION&&SESSION.quick)
        );
      }catch(e){}
    }

    /* ========================================================
       ۱۴) تشخیص و جابه‌جایی دکمه‌های پاسخ
       ======================================================== */
    function fixAnswerButtons(){
      try{
        var boxes=D.querySelectorAll(
          '#cardArea .actions,#cardArea #actions,.card-area .actions'
        );

        if(!boxes.length){
          var candidates=Array.from(
            D.querySelectorAll('#cardArea button')
          ).filter(function(b){
            var t=(b.textContent||'');
            return /درست|حدودی|غلط/.test(t);
          });

          if(candidates.length>=3){
            var parent=candidates[0].parentElement;
            if(parent&&candidates.every(function(x){return x.parentElement===parent;})){
              parent.style.display='grid';
              parent.style.gridTemplateColumns='repeat(3,minmax(0,1fr))';
              parent.style.gap='8px';
              parent.style.direction='ltr';
              boxes=[parent];
            }
          }
        }

        Array.from(boxes).forEach(function(box){
          box.style.direction='ltr';
          box.style.display='grid';
          box.style.gridTemplateColumns='repeat(3,minmax(0,1fr))';
          box.style.gap='8px';

          Array.from(box.querySelectorAll('button')).forEach(function(b){
            var t=(b.textContent||'').replace(/\\s/g,'');
            b.classList.remove(
              'v58-answer-good',
              'v58-answer-mid',
              'v58-answer-bad'
            );
            if(/درست|✓|✅/.test(t))
              b.classList.add('v58-answer-good');
            else if(/حدودی|نسبتاً|تقریب/.test(t))
              b.classList.add('v58-answer-mid');
            else if(/غلط|✗|❌/.test(t))
              b.classList.add('v58-answer-bad');

            b.style.direction='rtl';
          });
        });
      }catch(e){}
    }

    /* ========================================================
       ۱۵) refresh اولیه / MutationObserver
       ======================================================== */
    syncSessionClass();
    fixAnswerButtons();
    hookBackupInputs();
    addExamSettings();
    renderExamPlan();

    if(typeof MutationObserver!=='undefined'){
      var mo=new MutationObserver(function(){
        fixAnswerButtons();
        syncSessionClass();
        hookBackupInputs();
      });
      mo.observe(D.body,{childList:true,subtree:true});
    }

    /* ========================================================
       ۱۶) sync پس‌زمینه: سریع، بدون reload
       ======================================================== */
    var syncTimer=null;

    function queueSync(){
      clearTimeout(syncTimer);
      syncTimer=setTimeout(function(){
        try{
          if(W.syRec&&W.syRec().token&&W.syncOnce)
            W.syncOnce({background:true,v58:true});
        }catch(e){}
      },7000);
    }

    D.addEventListener('visibilitychange',function(){
      if(D.hidden){
        queueSync();
      }else{
        try{
          if(W.syRec&&W.syRec().token&&W.syncOnce)
            W.syncOnce({background:true,v58:true});
        }catch(e){}
      }
    });

    W.addEventListener('online',function(){
      try{
        if(W.syRec&&W.syRec().token&&W.syncOnce)
          W.syncOnce({background:true,v58:true});
      }catch(e){}
    });

    /* هر پاسخ کارت یک همگام‌سازی سبک را صف می‌کند */
    D.addEventListener('click',function(e){
      if(e.target.closest &&
         e.target.closest('#cardArea .actions,#actions')){
        queueSync();
      }
    },true);

    /* ذخیره‌های ساختاری مهم */
    D.addEventListener('click',function(e){
      var b=e.target.closest &&
        e.target.closest(
          '#btnNewTopic,#sdAdd,#sdBulk,#savV,#eSave,#mSave,'+
          '#sdDel,#btnUpJson,#btnUpTxt'
        );
      if(b){
        invalidateIndex();
        queueSync();
      }
    },true);

    /* ========================================================
       ۱۷) اطلاعات دسترسی برای برنامه
       ======================================================== */
    W.V58={
      version:58,
      refresh:refresh,
      fixAnswerButtons:fixAnswerButtons,
      renderExamPlan:renderExamPlan,
      scrollLastSub:scrollLastSub,
      invalidateIndex:invalidateIndex,
      queueSync:queueSync
    };

    /* ---------------------------------------------------------
       عنوان نسخه
       --------------------------------------------------------- */
    try{D.title='فلش‌کارت v58';}catch(e){}

    /* ---------------------------------------------------------
       اگر برنامه پایه هنوز درحال همگام اولیه است،
       بگذار نسخه ۵۸ آن را بدون reload ادامه دهد.
       --------------------------------------------------------- */
    try{
      if(W.syRec&&W.syRec().token){
        setTimeout(function(){
          try{W.syncOnce({background:true,v58:true});}catch(e){}
        },500);
      }
    }catch(e){}
  }
})();
</script>
</body>
</html>
